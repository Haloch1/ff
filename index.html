see. Then compare reasoning, including what would invalidate the idea. A teacher who shows losses, costs and pre-entry rules gives you more to evaluate than a highlight reel.<\/p><p>Do not treat a verified social account, follower count or P&L screenshot as audited evidence. Paid promotion, referral income, delayed posts and selective examples can distort what you see. A person may already be exiting while you copy the entry.<\/p>"}, {"title": "A repeatable preparation sheet", "body": "<p>For each candidate, record: instrument and venue; source of any catalyst; broader structure; key zones; spread and available depth; a potential trigger; invalidation; nearby obstacle; and the reason to skip. “Everyone is buying” is not a substitute.<\/p><p>For tokens, distribution maps and contract checks can reveal some risks but do not guarantee safety. They cannot establish that a developer will never act maliciously or that future exit liquidity will exist. Never enter a seed phrase into an educational site, including this app.<\/p>"}], "example": "<p>A creator posts “easy 5×” with a verified badge. You cannot find the actual entry time, losing trades or a primary source for the catalyst. Instead of copying, you record the claim as unverified and study a transparent chart example. Attention and legitimacy are different questions.<\/p>", "diy": "Draft a watchlist row for a fictional asset. Include two reasons to watch it and two conditions that would keep you out. Evaluate a creator by writing three questions you would ask about their evidence and incentives.", "answer": "<p>Example: watch because a defined range and sufficient simulated liquidity make mechanics easy to study; stay out if the trigger is absent or spread is too wide. Ask about complete records, costs and whether promotion/referrals are paid. These questions improve scrutiny without assuming every creator is dishonest.<\/p>", "takeaways": ["Research the instrument separately from the pattern.", "A verified account is not audited investment evidence.", "Learn from reasoning; do not outsource your decision to a feed."], "quiz": [{"q": "A verified social account proves a token is safe.", "options": ["True", "False", "Only after a volume spike"], "correct": 1, "hint": "Account identity/status is not asset due diligence.", "explain": "Verification does not establish asset quality, honest promotion or exit liquidity."}, {"q": "The most useful teacher shows…", "options": ["Only their largest winners", "Entries after the move already happened", "Predefined rules, costs, losses and limitations"], "correct": 2, "hint": "You need the full decision process.", "explain": "Transparent process is more informative than selected outcomes."}, {"q": "A chart pattern can fix a fraudulent underlying asset.", "options": ["Yes", "No", "Only with a stop"], "correct": 1, "hint": "Chart mechanics and legitimacy are separate.", "explain": "An exit order does not remove fraud or custody risk."}], "refs": ["S14", "S01"], "lab": null}, {"id": 22, "module": 4, "title": "Build one playbook you can actually test", "sub": "Turn “I feel good about it” into an if–then plan.", "goals": ["Specify context, trigger, invalidation and exit.", "Create a complete pre-trade checklist.", "Keep one rule set stable across a sample."], "sections": [{"title": "A setup is a recipe with conditions", "body": "<p>A <strong>playbook<\/strong> is a written description of a repeatable decision. It tells you when a setup is eligible, how entry is triggered, how size is calculated, what invalidates it and how it ends. The recipe must be clear enough that someone else can apply it to the same visible bars.<\/p><p>“Buy when it looks strong” is too vague to evaluate. “On completed five-minute bars, after a close above a marked zone and a retest, enter only if the retest high breaks” is more specific. Specific does not mean profitable.<\/p>"}, {"title": "A training playbook", "body": "<p>Context: upward structure on the selected larger timeframe. Location: first retest of a predefined resistance zone. Trigger: a completed upward confirmation after the retest. Invalidation: below the retest low under the rule. Size: risk calculation constrained by available cash. Exit: stop, defined target, time stop or session end.<\/p><p>Add vetoes: no unresolved news risk you cannot handle, no unclear asset rights, no unsuitable spread, no revenge entry. State which conditions are mandatory rather than counting random “confluences.”<\/p>"}, {"title": "Review the recipe separately from your obedience", "body": "<p>Record whether you followed the rules and what result occurred. If you followed them and lost, that is useful evidence about the rule. If you broke them and won, it is evidence about your behavior, not proof the strategy works.<\/p><p>Change one parameter after a review, label the new version and test it on a fresh sample. Quietly modifying every chart to make past trades look better creates a story, not a test.<\/p>"}], "example": "<p>Playbook v1: “Buy only the first qualified retest; no entry more than $0.10 above the chosen trigger in this fictional exercise; stop below retest low; exit at the next resistance or session end.” The $0.10 is specific to the exercise’s price scale and must not be copied to unrelated assets.<\/p>", "diy": "Write your own six-line playbook in the journal: context; setup/location; exact entry trigger; invalidation; sizing/cost rule; exit and vetoes. Could another person tell whether a trade followed it?", "answer": "<p>Replace feeling words with observable conditions. “Strong” becomes a defined swing sequence or close rule. “When I feel good” becomes an exit condition chosen before the outcome. Retain room for “no trade” when any mandatory condition is missing.<\/p>", "takeaways": ["Specific rules can be tested; feelings alone cannot.", "A clear rule still needs evidence.", "Version changes instead of rewriting history."], "quiz": [{"q": "Which is more testable?", "options": ["Buy when the vibe is good", "Buy after a completed close above a premarked zone, under fixed conditions", "Buy whatever is popular"], "correct": 1, "hint": "Can two people apply it consistently?", "explain": "Observable conditions make agreement and review possible."}, {"q": "A rule-following loss means…", "options": ["The trader necessarily made a mistake", "One negative outcome under the rule", "The next trade must win"], "correct": 1, "hint": "Process and outcome are distinct.", "explain": "A single loss does not establish whether the rule has an edge."}, {"q": "After changing a rule, you should…", "options": ["Rewrite all old notes", "Label a new version and use a fresh test sample", "Hide the losing examples"], "correct": 1, "hint": "Protect the integrity of the experiment.", "explain": "Versioning separates old evidence from a revised hypothesis."}], "refs": ["S11"], "lab": null}, {"id": 23, "module": 4, "title": "Manage the trade without moving the goalposts", "sub": "Stops, targets, partial exits and the problem with “I’ll know when.”", "goals": ["Compare fixed, trailing and time-based exits.", "Understand partial-exit arithmetic.", "Keep execution separate from emotional relief."], "sections": [{"title": "Three ways a plan can end", "body": "<p>A fixed exit uses preselected stop and target conditions. A trailing exit moves according to an explicit rule, such as beneath newly confirmed swing lows for a long trade. A time exit closes when the expected behavior does not occur within a defined window or when the session ends.<\/p><p>No exit dominates every market. A tight trail can leave early; a loose one can give back profits. A distant fixed target can miss a profitable reversal. Test the tradeoff rather than seeking an exit that captures every peak.<\/p>"}, {"title": "Partial exits change the payoff", "body": "<p>Suppose you hold 100 units, take half off at +1R per unit and the remainder at +2R. Ignoring costs, the full-position result is 0.5 × 1R + 0.5 × 2R = <strong>+1.5R<\/strong>, not +3R. If the remainder instead loses 1R per unit, the gross overall result is zero.<\/p><p>Extra executions may add costs. A partial exit can reduce open exposure but may also cut average winners. Track the full trade, not only the first profitable fill.<\/p>"}, {"title": "Breakeven is not always economically flat", "body": "<p>Moving a stop to the entry price is often called moving to breakeven. Fees, spread and slippage can still leave a net loss. A stop placed too close may also be reached by ordinary noise before the original setup resolves.<\/p><p>Do not widen a stop or add size solely to avoid accepting a loss. A planned, tested adjustment is different from improvising under pressure. When the app closes a trade at session end, that is a model rule—not evidence that all real positions can always exit promptly.<\/p>"}], "example": "<p>Buy 40 shares at $25; sell 20 at $25.50 and 20 at $24.50. Gross gain on the first half is $10; loss on the second is $10. Gross result is zero, and costs make it negative. “I took profit” does not by itself describe the whole trade.<\/p>", "diy": "Initial risk is $40 on 100 shares. Half exits at a price corresponding to +2R; half exits at −1R. Find the full-trade gross R and dollars. Then write an objective time-exit rule for a paper exercise.", "answer": "<p>0.5 × 2R − 0.5 × 1R = +0.5R, or $20 before costs. Example time rule: close at the end of the sixth completed bar after entry if neither protective level was reached. That is a test rule, not a proven optimal exit.<\/p>", "takeaways": ["You cannot know the exact peak in advance.", "Partial exits must be combined by quantity.", "Entry-price stops are not necessarily net breakeven."], "quiz": [{"q": "Half exits +1R and half +2R. Total gross result?", "options": ["+3R", "+1.5R", "+0.5R"], "correct": 1, "hint": "Weight each outcome by half the original position.", "explain": "0.5 × 1 + 0.5 × 2 = 1.5R."}, {"q": "Selling at your entry price guarantees zero net P&L.", "options": ["True", "False", "Only on a green candle"], "correct": 1, "hint": "Include costs.", "explain": "Fees and execution friction can produce a loss even at the same displayed price."}, {"q": "An objective time exit might be…", "options": ["Sell when I get nervous", "Close after six completed bars if the setup has not resolved", "Wait until a profit eventually appears"], "correct": 1, "hint": "Choose a measurable event.", "explain": "A fixed bar count is reproducible; the other descriptions are not."}], "refs": ["S02", "S11"], "lab": null}, {"id": 24, "module": 5, "title": "Backtesting, replay and paper trading honestly", "sub": "Do not let a beautiful practice record fool you.", "goals": ["Distinguish three kinds of testing.", "Identify look-ahead, selection and overfitting.", "Keep synthetic training separate from market evidence."], "sections": [{"title": "Three different laboratories", "body": "<p><strong>Backtesting<\/strong> applies defined rules to historical data. <strong>Replay<\/strong> reveals historical or synthetic bars in sequence so you practice decisions without seeing later prices. <strong>Paper trading<\/strong> simulates orders and balances. None automatically represents the fills or emotions of real money.<\/p><p>This app uses synthetic replay and a synthetic paper desk. They are excellent for learning vocabulary and mechanics, but their results are not a test of how an actual market rewards your strategy.<\/p>"}, {"title": "The four traps", "body": "<p><strong>Look-ahead bias<\/strong>: using information not yet known at entry, such as a later-confirmed swing. <strong>Selection bias<\/strong>: testing only clean winners. <strong>Survivorship bias<\/strong>: excluding assets that disappeared or failed. <strong>Overfitting<\/strong>: changing rules until random historical noise looks like a reliable system.<\/p><p>Choosing a perfect stop after seeing the entire chart is not the same as choosing it before entry. Neither is deleting bad trades and reporting the cleaned record as untouched performance.<\/p>"}, {"title": "A better research sequence", "body": "<p>Write one rule set. Learn the mechanics here. Then, for a real-market study, use suitable historical data, realistic costs and executable timing assumptions; log every qualifying example, including failures. Keep a later, untouched sample for out-of-sample evaluation.<\/p><p>A collection of 30 or 50 practice examples can reveal repeated mistakes; it is not a statistically sufficient certificate of an edge. Even larger samples can fail under new regimes. Paper profitability alone never obligates you to trade real money.<\/p>"}], "example": "<p>You see that a stock’s daily high was $52 and claim an exit at exactly $52, though your written rule had no way to choose it at the time. That is hindsight. An honest model might use a preset limit or the next available execution after an observable signal instead.<\/p>", "diy": "Find the bias: (1) you test only charts from winning social posts; (2) a swing is used two candles before it is confirmed; (3) you try 80 indicator combinations and report only the best; (4) a delisted loser is missing from the data.", "answer": "<p>(1) Selection bias. (2) Look-ahead bias. (3) Overfitting/data mining, plus selection if the other tests are hidden. (4) Survivorship bias. Multiple biases can occur together.<\/p>", "takeaways": ["Generated practice is not real-market evidence.", "Keep an untouched out-of-sample test.", "Edited histories must be labeled as edited."], "quiz": [{"q": "Using a future-confirmed swing at an earlier entry is…", "options": ["Look-ahead bias", "A spread calculation", "Risk diversification"], "correct": 0, "hint": "The signal was not known then.", "explain": "Future information has leaked into the decision."}, {"q": "100 profitable synthetic trades prove a real-market edge.", "options": ["True", "False", "Only with perfect quiz scores"], "correct": 1, "hint": "The price-generation model is not the market.", "explain": "Synthetic outcomes cannot validate live-market profitability."}, {"q": "Deleting losses and presenting the history as untouched is…", "options": ["An honest performance record", "Misleading", "Required for clean accounting"], "correct": 1, "hint": "Editing changes the evidence.", "explain": "The app permits practice correction but labels edited records."}], "refs": ["S01", "S11"], "lab": null}, {"id": 25, "module": 5, "title": "Psychology, journals and protecting your real life", "sub": "Build a routine that still works after a loss.", "goals": ["Recognize FOMO, revenge trading and outcome bias.", "Write useful before-and-after notes.", "Keep learning compatible with school, business and sleep."], "sections": [{"title": "Emotions are information, not orders", "body": "<p><strong>FOMO<\/strong> is fear of missing out. It can push you to enter late. <strong>Revenge trading<\/strong> is taking extra or larger risk to recover a loss. <strong>Outcome bias<\/strong> judges the decision only by whether it won.<\/p><p>You do not need to feel emotionless. You need rules that do not depend on feeling calm in the moment. A pause after a loss or rule violation can prevent a new decision from becoming an attempt to repair your mood.<\/p>"}, {"title": "A useful journal is specific", "body": "<p>Before entry: record context, trigger, invalidation, size, costs and why skipping would be reasonable. After exit: record the actual fill, any slippage, result and whether the rules were followed. Then name one concrete improvement.<\/p><p>“Bad trade, do better” is hard to act on. “I entered before the required five-minute close; next practice session I will place orders only after the bar advances” identifies a behavior you can change.<\/p>"}, {"title": "Give learning boundaries", "body": "<p>Choose a study window that does not displace your business, school, prayer, sleep or relationships. This course has no countdown requiring real-money trading. Working slowly through one lesson and a few examples can be more useful than clicking through everything in a night.<\/p><p>For practice, you can set a session stop after a certain loss or a rule violation. That is a behavior limit, not proof that the first trades are safe. If trading feels compulsive, stepping away and seeking support is a sensible response.<\/p>"}], "example": "<p>After a planned paper loss, you feel an urge to double the next position. A journal entry reads: “Emotion 8/10; revenge urge; no new trade; reviewed entry timing instead.” The useful achievement is following the boundary, not manufacturing a recovery.<\/p>", "diy": "Write a pre-session boundary, a pause trigger and a post-session review question. Then create a journal entry for a winning trade that broke a rule.", "answer": "<p>Example: study for a chosen window without interrupting business work; pause after a rule violation; review whether entries used only available information. Winning-rule-violation note: “Positive outcome, negative process; this win does not justify repeating the mistake.”<\/p>", "takeaways": ["A pause is a legitimate trading decision.", "Journal behaviors, not only emotions or P&L.", "Keep your business and essential life priorities protected."], "quiz": [{"q": "Doubling size to recover a loss is commonly called…", "options": ["Revenge trading", "Diversification", "Backtesting"], "correct": 0, "hint": "The motive is getting even.", "explain": "It is emotion-driven risk escalation."}, {"q": "Which note is more useful?", "options": ["I am terrible", "I entered one bar before my trigger; next time I will wait", "Everything is manipulated"], "correct": 1, "hint": "Name an observable behavior and next action.", "explain": "Specific notes create a testable improvement."}, {"q": "A winning rule violation is…", "options": ["Proof the rule is wrong", "A positive outcome with a process problem", "A reason to increase risk"], "correct": 1, "hint": "Keep process and outcome separate.", "explain": "The profit does not erase the rule violation."}], "refs": ["S01", "S11"], "lab": null}, {"id": 26, "module": 5, "title": "Before any real-money decision", "sub": "Account rules, faith considerations and a deliberate off-ramp.", "goals": ["Know what the simulator leaves out.", "Check current rules with the actual broker.", "Understand that course completion is not live-trading clearance."], "sections": [{"title": "The account is part of the trade", "body": "<p>Cash, margin and custody arrangements differ. Most U.S. equity trades currently use T+1 settlement: the next business day, not 24 elapsed hours. Cash-account activity must respect payment and settlement requirements. The paper desk makes sale proceeds reusable immediately; it does <strong>not<\/strong> model settled cash, holidays or violations.<\/p><p>U.S. intraday margin guidance changed in 2026. Do not copy a fixed account-minimum rule from an old video and assume it applies now. Follow the current FINRA guidance and your broker’s implementation, eligibility and house rules. This course does not implement margin trading.<\/p>"}, {"title": "Other real-world checks", "body": "<p>Understand fees, custody, market-data delays, tax reporting, order routing, outage procedures and the exact contract before placing real orders. If you are under 18, involve a parent or guardian and use only accounts for which you are legally eligible; do not misstate your age.<\/p><p>Do not use essential living money, school money, borrowed funds or your business’s operating cash as experiment capital. A real-money decision deserves an independent suitability review, not just an app’s completion badge.<\/p>"}, {"title": "Keep the faith question specific", "body": "<p>Ask a qualified Islamic-finance scholar about the actual asset and account: ownership and possession; business activities; interest or borrowing; cash sweep/lending arrangements; contract mechanics; and deceptive or manipulative conduct. A stock or ETF label alone does not settle these questions.<\/p><p>Your earlier concern about memecoins should not be resolved by pretending every conventional trade is automatically permissible. Learning charts is separate from choosing a transaction. There is no need to force a religious conclusion from a practice profit.<\/p>"}], "example": "<p>A paper trade uses cash from a sale seconds earlier. In a real U.S. cash account, settlement restrictions can matter. Copying the simulator’s activity without checking funding rules can create a violation. A simulation shortcut is not permission from your broker or a scholar.<\/p>", "diy": "Write a real-money gate with four categories: legal/account eligibility; instrument and faith review; risk/capital protection; evidence and execution understanding. Add an explicit “not ready / choose not to trade” outcome.", "answer": "<p>A strong gate allows you to stop. It asks whether you understand the exact account, have resolved the relevant religious questions with qualified help, are protecting essential capital, and have evidence beyond synthetic practice. Passing lessons does not automatically satisfy any of these conditions.<\/p>", "takeaways": ["Paper cash is not settled brokerage cash.", "Verify current rules and account eligibility.", "A learning certificate would not be a suitability or Shariah certificate."], "quiz": [{"q": "T+1 generally means…", "options": ["One business day after the trade", "Exactly 24 hours later", "Instant settlement"], "correct": 0, "hint": "Weekends and holidays can matter.", "explain": "It is a business-day settlement convention for most U.S. equity trades."}, {"q": "The simulator’s immediately reusable sale cash proves a real broker allows the same sequence.", "options": ["True", "False", "Only after a win"], "correct": 1, "hint": "The settlement model is intentionally simplified.", "explain": "Real account payment and settlement rules require separate checking."}, {"q": "Completing this course automatically makes live trading suitable and halal.", "options": ["True", "False", "Only with an 80% score"], "correct": 1, "hint": "Course knowledge cannot approve a specific contract or your circumstances.", "explain": "Suitability and religious assessment are separate, instrument-specific decisions."}], "refs": ["S12", "S13", "S01", "S15"], "lab": null}, {"id": 27, "module": 5, "title": "Capstone: run a complete practice session", "sub": "Connect the vocabulary, pattern, risk, execution and review.", "goals": ["Complete a trade plan without seeing the future.", "Use a practice portfolio and review its accounting.", "Decide what to study next instead of rushing live."], "sections": [{"title": "Prepare before you press play", "body": "<p>Choose one playbook from this course. Write its context, entry, invalidation, target/time exit and vetoes in your journal. Select a replay or the paper desk. Identify the displayed timeframe, current structure and relevant zones before any order.<\/p><p>State what would make you wait or skip. A capstone in which you make no trade can be excellent work if the conditions never appear. The objective is not to create activity.<\/p>"}, {"title": "Execute and keep an honest record", "body": "<p>Calculate quantity from an illustrative risk budget and available cash. Include execution costs. Place only the order your plan specifies. Advance one bar at a time and notice whether you are reacting to new information or to discomfort.<\/p><p>After the exit, reconcile cash, remaining holdings, realized result and unrealized result. Check the difference between gross price movement and net P&L. If you correct an accidental fill, use the deletion preview and keep the record’s edited label.<\/p>"}, {"title": "Review like a researcher", "body": "<p>Write what was visible at entry, what surprised you, whether the rule was followed and one next experiment. Separate pattern recognition, execution skill and evidence of an edge: they are not the same achievement.<\/p><p>Repeat unfamiliar topics rather than memorizing the synthetic future. The next layer of study can include data quality, realistic execution, instrument research and statistics. You can also choose long-term investing or your business instead of day trading. The purpose is better judgment, not a forced career path.<\/p>"}], "example": "<p>Example review: “I saw higher lows and a retest but bought one bar early. The trade won $12 net. My execution score is still poor because the trigger had not completed. Next exercise: wait for a completed trigger and save the pre-entry explanation.”<\/p>", "diy": "Complete one documented replay and one paper-desk session. Save a journal entry, inspect the ledger, export a backup and explain one reason you might choose not to trade real money. Do not count the profit as a passing criterion.", "answer": "<p>Completion checklist: a pre-entry plan exists; no future bars were used; size and costs were calculated; the exit followed a rule; ledger balances reconcile; a journal and backup exist; limitations are acknowledged. A loss or a reasoned skip can satisfy every criterion.<\/p>", "takeaways": ["Process quality is the capstone—not profit.", "Back up your work and label corrections.", "Continue learning without a deadline to risk real money."], "quiz": [{"q": "The strongest capstone evidence is…", "options": ["The biggest profit screenshot", "A complete plan, honest execution record and review", "The most trades in one hour"], "correct": 1, "hint": "Evaluate what you can control.", "explain": "Documentation and rule-following are meaningful learning outcomes."}, {"q": "You reset a replay after learning its future. A win on the second try is…", "options": ["Independent evidence of an edge", "Rehearsal with prior knowledge", "A real-market return"], "correct": 1, "hint": "You already know some outcomes.", "explain": "Repeated known paths are practice, not out-of-sample evidence."}, {"q": "A valid course outcome is deciding not to day trade.", "options": ["Yes", "No", "Only after losing real money"], "correct": 0, "hint": "Education should improve choice, not force an activity.", "explain": "An informed decision not to trade can be a successful result."}], "refs": ["S01", "S11"], "lab": null}], "modules": [{"title": "Start with the market", "label": "Foundations", "desc": "Read price, understand the instrument and learn what execution really means."}, {"title": "Protect the downside", "label": "Risk & orders", "desc": "Order types, sizing and the arithmetic that screenshots leave out."}, {"title": "Understand the chart", "label": "Chart reading", "desc": "Structure, levels, volume and indicators in plain English."}, {"title": "Build a pattern vocabulary", "label": "Pattern studio", "desc": "Recognize setups, failure conditions and the reasons to wait."}, {"title": "Make a complete decision", "label": "Trade planning", "desc": "Watchlists, no-trade rules, execution and exits."}, {"title": "Practice like a researcher", "label": "Review & readiness", "desc": "Testing, journaling, real-world limitations and a capstone."}], "sources": [{"id": "S01", "name": "FINRA · Day-Trading Risk Disclosure", "url": "https://www.finra.org/rules-guidance/rulebooks/finra-rules/2270", "note": "Risk of substantial loss, execution problems and trading costs. This is not an endorsement of day trading."}, {"id": "S02", "name": "SEC Investor.gov · Types of Orders", "url": "https://www.investor.gov/introduction-investing/investing-basics/how-stock-markets-work/types-orders", "note": "Market, limit and stop orders; price versus execution certainty."}, {"id": "S03", "name": "Fidelity · What Are Charts?", "url": "https://www.fidelity.com/learning-center/trading-investing/technical-analysis/what-are-charts", "note": "Price-chart construction and chart types."}, {"id": "S04", "name": "Fidelity · Basic Concepts of Trend", "url": "https://www.fidelity.com/learning-center/trading-investing/technical-analysis/basic-concepts-trend", "note": "Peaks, troughs and trend direction."}, {"id": "S05", "name": "Fidelity · Support and Resistance", "url": "https://www.fidelity.com/learning-center/trading-investing/technical-analysis/support-and-resistance", "note": "Support, resistance and possible role reversal. Levels can fail."}, {"id": "S06", "name": "Schwab · How to Read Stock Charts and Trading Patterns", "url": "https://www.schwab.com/learn/story/how-to-read-stock-charts-and-trading-patterns", "note": "Candles, trend and common pattern families. Technical analysis is not a complete investment analysis."}, {"id": "S07", "name": "TradingView · Volume Weighted Average Price", "url": "https://www.tradingview.com/support/solutions/43000502018-volume-weighted-average-price-vwap/", "note": "VWAP formula, anchors and indicator limitations."}, {"id": "S08", "name": "Fidelity · Exponential Moving Average", "url": "https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/ema", "note": "EMA construction and interpretation."}, {"id": "S09", "name": "Fidelity · Relative Strength Index", "url": "https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/RSI", "note": "RSI interpretation; extreme readings are not automatic reversals."}, {"id": "S10", "name": "Fidelity · Average True Range", "url": "https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/atr", "note": "ATR measures volatility, not direction."}, {"id": "S11", "name": "Schwab · Elements of a Smart Trade Plan", "url": "https://www.schwab.com/learn/story/5-elements-smart-trade-plan", "note": "Planning entries, exits and risk before a trade."}, {"id": "S12", "name": "FINRA · Frequent Intraday Trading", "url": "https://www.finra.org/investors/insights/frequent-intraday-trading", "note": "Cash-account funding, settlement and account-specific rules. Page dated June 4, 2026."}, {"id": "S13", "name": "FINRA · Intraday Margin Requirements", "url": "https://www.finra.org/investors/insights/intraday-margin-requirements", "note": "Current framework and implementation details; verify your broker’s requirements rather than relying on old videos."}, {"id": "S14", "name": "FINRA · Social Media-Influenced Investing", "url": "https://www.finra.org/rules-guidance/key-topics/fintech/report/social-media-influenced-investing", "note": "Research on how online information affects investing; evaluate incentives and conflicts."}, {"id": "S15", "name": "International Islamic Fiqh Academy · Resolution 237", "url": "https://iifa-aifi.org/en/5980.html", "note": "2019 resolution identified unresolved cryptocurrency classification questions. It is not a blanket approval of crypto or memecoins."}, {"id": "S16", "name": "Fidelity · Technical Analysis Learning Center", "url": "https://www.fidelity.com/learning-center/trading-investing/technical-analysis/using-technical-analysis", "note": "Optional articles, chart tutorials and indicator references."}, {"id": "S17", "name": "Fidelity · What Is Technical Trading?", "url": "https://www.fidelity.com/learning-center/trading-investing/technical-trading", "note": "Optional official educational video page. Internet access required."}], "glossary": [{"term": "Ask", "category": "Market mechanics", "definition": "The lowest currently quoted price at which a seller is offering an asset on the observed venue. The quantity available there matters.", "example": "Bid $9.98 and ask $10.02: a small market buy may start near $10.02.", "trap": "The last trade at $10 is not a promise of an available $10 purchase.", "lesson": 3}, {"term": "Bid", "category": "Market mechanics", "definition": "The highest currently quoted price a buyer is offering on the observed venue. A market seller generally trades against available bids.", "example": "With a $49.90 bid, a small market sale may start near $49.90.", "trap": "Large orders can exhaust that quote and reach lower bids.", "lesson": 3}, {"term": "Spread", "category": "Market mechanics", "definition": "The difference between the best ask and best bid. Crossing it is one source of trading friction, even when there is no separate commission.", "example": "Ask $20.05 minus bid $19.95 gives a $0.10 spread.", "trap": "A zero-commission label does not mean a zero-cost round trip.", "lesson": 3}, {"term": "Liquidity", "category": "Market mechanics", "definition": "How readily an asset can be traded without a large price impact, considering available size and market conditions. It can change suddenly.", "example": "A deep market may absorb 100 shares near the quoted price; a thin one may not.", "trap": "Market cap and past volume do not guarantee future exit liquidity.", "lesson": 3}, {"term": "Market depth", "category": "Market mechanics", "definition": "The displayed quantities offered to buy and sell at multiple price levels. It is a partial, changing view of available orders.", "example": "There may be 50 shares at $10 and 1,000 more offered at $10.10.", "trap": "Displayed orders can be canceled, and not all interest is visible.", "lesson": 3}, {"term": "Volume", "category": "Market mechanics", "definition": "The number of units actually traded during a chosen interval. It measures activity rather than identifying who will profit.", "example": "A five-minute volume bar of 20,000 means 20,000 units traded in that interval.", "trap": "Every matched trade has both a buyer and a seller.", "lesson": 10}, {"term": "Relative volume", "category": "Market mechanics", "definition": "A comparison of current trading activity with a specified historical baseline. The window and time-of-day adjustment matter.", "example": "20,000 units versus a comparable average of 10,000 is 2× relative volume.", "trap": "Comparing opening activity with quiet midday activity can distort the comparison.", "lesson": 10}, {"term": "Market capitalization", "category": "Market mechanics", "definition": "Price multiplied by the relevant share count or circulating token supply. It is a valuation measure, not a pool of withdrawable money.", "example": "A token at $0.01 with 200 million circulating units has a $2 million circulating market cap.", "trap": "A $2 million market cap does not mean everyone can collectively exit for $2 million at that price.", "lesson": 3}, {"term": "Fully diluted valuation (FDV)", "category": "Market mechanics", "definition": "A token valuation calculation using an assumed full supply, often maximum or total supply depending on the provider. It differs from circulating market cap.", "example": "At $0.10 and an assumed 1 billion full supply, FDV is $100 million.", "trap": "Check the supply definition and unlock schedule; providers may use different assumptions.", "lesson": 3}, {"term": "Float", "category": "Market mechanics", "definition": "For a stock, shares generally available for public trading after excluding certain restricted or closely held shares under the provider’s definition.", "example": "A company can have 100 million shares outstanding but a smaller tradable float.", "trap": "A small float is not automatically an opportunity; it can amplify execution risk.", "lesson": 3}, {"term": "Price impact", "category": "Market mechanics", "definition": "The movement in execution prices caused by the size of your own trade relative to available liquidity.", "example": "Buying through a thin order book fills some units at $10 and others at $10.20.", "trap": "Your exit can move the price too; chart gains may overstate realizable gains.", "lesson": 3}, {"term": "Slippage", "category": "Orders & risk", "definition": "The difference between an expected execution price and the actual fill. It can arise from changing quotes, gaps, latency or insufficient liquidity.", "example": "You plan an exit at $50 but receive $49.80.", "trap": "A stop trigger is not a guarantee of the expected execution price.", "lesson": 5}, {"term": "Market order", "category": "Orders & risk", "definition": "An instruction prioritizing trading at currently available prices over a specific price limit. Execution still depends on the market being able to trade.", "example": "A market buy may fill at the current ask and additional higher prices if needed.", "trap": "A halt or outage can prevent prompt execution.", "lesson": 5}, {"term": "Limit order", "category": "Orders & risk", "definition": "An order that constrains the worst acceptable price: a maximum for a buy or a minimum for a sell. Execution is not guaranteed.", "example": "A buy limit at $30 can fill at $30 or lower, or remain unfilled.", "trap": "A candle touching the price does not prove your real queue position would have filled.", "lesson": 5}, {"term": "Stop-market order", "category": "Orders & risk", "definition": "An order that becomes a market order after its specified trigger condition is met. The trigger and final execution price can differ.", "example": "A sell stop at $19.50 may execute below that price during a fast drop.", "trap": "A stop is not insurance against all loss beyond the planned amount.", "lesson": 5}, {"term": "Stop-limit order", "category": "Orders & risk", "definition": "An order that activates a limit order after a trigger. It constrains execution price but can fail to exit when price gaps beyond the limit.", "example": "A stop at $20 with sell limit $19.90 can remain unfilled after a gap to $19.", "trap": "Price protection can leave a position exposed.", "lesson": 5}, {"term": "Bracket / OCO", "category": "Orders & risk", "definition": "A bracket pairs planned exits such as a stop and target; one-cancels-the-other means one execution cancels the paired order. Exact support depends on the platform.", "example": "A long position has a $49 stop and $52 target; filling one removes the other in this app.", "trap": "Two independent sell orders are not necessarily an OCO bracket.", "lesson": 5}, {"term": "Fill", "category": "Orders & risk", "definition": "An execution of some or all of an order. The fill contains a quantity and price; the requested order may differ from what actually executed.", "example": "An order for 100 shares can receive 40 at one price and 60 at another.", "trap": "This simulator assumes full eligible fills and does not model queues or partial executions.", "lesson": 5}, {"term": "Gap", "category": "Charts", "definition": "A discontinuity between trading prices, often visible between one bar’s close and the next bar’s open. New information or thin markets can cause it.", "example": "A bar closes at $40; the next opens at $38.50.", "trap": "A stop at $39.50 may not execute there.", "lesson": 19}, {"term": "Time in force", "category": "Orders & risk", "definition": "The duration for which an order remains eligible, subject to venue and broker rules.", "example": "A Day order expires at the relevant session boundary; GTC follows the broker’s longer-lived order rules.", "trap": "Do not assume an order remains active indefinitely or outside supported hours.", "lesson": 5}, {"term": "Position", "category": "Orders & risk", "definition": "The quantity of an asset or contract currently held or owed. This app permits only owned, positive quantities.", "example": "Buying 30 units creates a 30-unit long position; selling 10 leaves 20.", "trap": "Position value is not the same as planned stop risk.", "lesson": 0}, {"term": "Long", "category": "Orders & risk", "definition": "An exposure that generally benefits from rising price. In the course, it means buying and owning virtual units before selling them.", "example": "Buy at $10 and sell at $11: a long gains $1 per unit before costs.", "trap": "A long can still lose its full purchase value in a severe asset failure.", "lesson": 4}, {"term": "Short selling", "category": "Orders & risk", "definition": "Selling an asset you do not own through a borrowing arrangement, generally hoping to buy it back lower. Derivatives can create other short exposures.", "example": "Sell borrowed shares at $20, later buy them back at $18.", "trap": "Risks, costs and religious questions differ from a simple long purchase; this app does not support shorting.", "lesson": 4}, {"term": "Leverage", "category": "Orders & risk", "definition": "Exposure larger than your own committed capital through borrowing or contract design. It magnifies both favorable and unfavorable moves.", "example": "$1,000 supporting $5,000 exposure is a 5:1 exposure-to-capital ratio.", "trap": "A small adverse move can cause a large capital loss or forced liquidation.", "lesson": 4}, {"term": "Margin", "category": "Orders & risk", "definition": "An account or collateral arrangement supporting borrowing or leveraged exposure; the exact meaning depends on the product.", "example": "A broker may lend against securities under its margin agreement.", "trap": "A deposit requirement is not the maximum possible loss.", "lesson": 4}, {"term": "Liquidation", "category": "Orders & risk", "definition": "Forced closure of exposure by a platform or lender under its rules when collateral is insufficient or other conditions are met.", "example": "A leveraged position may be forcibly sold after a sharp adverse move.", "trap": "A liquidation price is not a protective stop you fully control.", "lesson": 4}, {"term": "Invalidation", "category": "Orders & risk", "definition": "A predefined observation that means the trade no longer satisfies its original idea or rules.", "example": "A retest long becomes invalid under a rule when the specified retest low breaks.", "trap": "Moving the invalidation to avoid taking a loss changes the strategy after entry.", "lesson": 6}, {"term": "Position sizing", "category": "Orders & risk", "definition": "Choosing quantity from a risk budget, a meaningful exit distance, execution costs and available capital.", "example": "Risk $20 at $0.50 planned loss per unit gives 40 units before a cash constraint.", "trap": "A tiny artificial stop can create a dangerously large position.", "lesson": 6}, {"term": "Notional value", "category": "Orders & risk", "definition": "The total size of exposure in price terms, commonly units multiplied by price for a simple cash asset.", "example": "50 units at $20 have $1,000 notional value.", "trap": "Notional, margin deposit and planned stop risk are different numbers.", "lesson": 6}, {"term": "R-multiple", "category": "Orders & risk", "definition": "Trade P&L divided by the initial planned risk. Keeping the denominator fixed makes outcomes easier to compare.", "example": "Initial risk $20, net loss $30: −1.5R.", "trap": "Do not change the original denominator afterward to flatter performance.", "lesson": 7}, {"term": "Reward-to-risk", "category": "Orders & risk", "definition": "The planned gain to a target divided by the planned loss to the stop, with costs considered where possible.", "example": "$0.90 reward divided by $0.30 risk gives 3:1 before costs.", "trap": "It does not mean the target has any particular probability of being reached.", "lesson": 7}, {"term": "Expectancy", "category": "Review", "definition": "The average result expected or estimated from the distribution of wins, losses and costs. An estimate is uncertain.", "example": "40% × $30 average win − 60% × $10 average loss = $6 before any costs not already included.", "trap": "A favorable assumed formula is not evidence your strategy achieves those probabilities.", "lesson": 7}, {"term": "Win rate", "category": "Review", "definition": "The proportion of a defined set of trades that were profitable. Its meaning depends on the definition of a trade and the sample.", "example": "12 profitable trades out of 20 gives a 60% sample win rate.", "trap": "Many small wins can be outweighed by a few large losses.", "lesson": 7}, {"term": "Profit factor", "category": "Review", "definition": "Gross profits from profitable trades divided by the absolute total losses from losing trades in a defined sample. Use consistent net/gross conventions.", "example": "$300 in wins divided by $200 in losses gives 1.5.", "trap": "A tiny sample or missing losses can make this ratio misleading.", "lesson": 24}, {"term": "Drawdown", "category": "Review", "definition": "A fall from a prior equity peak to a subsequent lower value, commonly expressed in dollars or as a percentage of that peak.", "example": "From a $12,000 peak to $10,800 is a $1,200 or 10% drawdown.", "trap": "Recovering a percentage loss requires a larger percentage gain on the smaller base.", "lesson": 7}, {"term": "Realized P&L", "category": "Review", "definition": "Profit or loss on the quantity already sold, using an identified cost-basis and fee convention.", "example": "Sell units for $210 net that cost $200 including allocated entry fees: realized gain $10.", "trap": "Selling part of a position realizes only that part’s result.", "lesson": 23}, {"term": "Unrealized P&L", "category": "Review", "definition": "The estimated gain or loss on open holdings compared with their cost basis. It changes with the mark price and may not be realizable exactly.", "example": "Units that cost $500 now marked at $520 show $20 unrealized gain before remaining exit costs.", "trap": "The marked price is not a guaranteed liquidation price.", "lesson": 23}, {"term": "Equity", "category": "Review", "definition": "In an account context, its net value: cash plus marked positions minus liabilities. This app has no borrowing liabilities.", "example": "$9,000 cash plus $1,020 in held assets gives $10,020 paper equity.", "trap": "Account equity is different from the general word “equities” for stocks.", "lesson": 7}, {"term": "Cost basis", "category": "Review", "definition": "The accounting cost assigned to held or sold units under a stated method. Here, entry fees are included and average cost is used for partial exits.", "example": "10 units at $50 plus a $1 entry fee create $501 total basis.", "trap": "Tax-accounting rules can differ; this app is not a tax ledger.", "lesson": 23}, {"term": "OHLC", "category": "Charts", "definition": "Open, high, low and close: four values summarizing recorded prices in one interval.", "example": "O=10, H=11, L=9, C=10.50 shows the start, extremes and end.", "trap": "The four numbers do not reveal the sequence of the high and low.", "lesson": 1}, {"term": "Candle body", "category": "Charts", "definition": "The thick part of a candle between open and close. Its height is the absolute difference between them.", "example": "Open $10 and close $10.60 gives a $0.60 body.", "trap": "It is not the candle’s full high-to-low range.", "lesson": 1}, {"term": "Wick / shadow", "category": "Charts", "definition": "The thin extension from the body to the high or low reached during the interval.", "example": "Body top $20.50 and high $21 create a $0.50 upper wick.", "trap": "A wick records an excursion, not proof of manipulation.", "lesson": 1}, {"term": "Timeframe", "category": "Charts", "definition": "The interval of trades combined into each candle. It differs from zoom, which changes how many bars you see.", "example": "A five-minute candle groups five minutes of activity.", "trap": "A small-timeframe rise can occur within a larger-timeframe downtrend.", "lesson": 2}, {"term": "Swing high / low", "category": "Charts", "definition": "A local peak or trough under a chosen rule. Confirmation can require later bars.", "example": "A high above the two highs before and after it is confirmed only after those later bars exist.", "trap": "Do not backdate a confirmed swing signal in a test.", "lesson": 8}, {"term": "Higher high / higher low", "category": "Charts", "definition": "A peak above a previous comparable peak, and a trough above a previous comparable trough. Together they commonly describe upward structure.", "example": "Peaks 50 then 52; troughs 48 then 49.", "trap": "One higher high without broader context does not guarantee an uptrend.", "lesson": 8}, {"term": "Lower high / lower low", "category": "Charts", "definition": "A peak below a previous comparable peak, and a trough below a previous comparable trough. Together they commonly describe downward structure.", "example": "Peaks 52 then 50; troughs 49 then 47.", "trap": "A brief bounce does not necessarily break the larger sequence.", "lesson": 8}, {"term": "Support", "category": "Charts", "definition": "An area where declining price previously met enough demand to stabilize or reverse. It is a hypothesis about future reactions, not a guarantee.", "example": "Several reactions around $30 suggest a possible support zone.", "trap": "The next visit can break the area.", "lesson": 9}, {"term": "Resistance", "category": "Charts", "definition": "An area where rising price previously met enough supply to stall or reverse.", "example": "Repeated stalls between $39.90 and $40.10 suggest resistance near $40.", "trap": "A line is not an impenetrable ceiling.", "lesson": 9}, {"term": "Breakout", "category": "Patterns", "definition": "Movement beyond a preselected boundary under a defined rule, such as an intrabar breach or a completed close.", "example": "A close above a $50 resistance zone can satisfy a close-based breakout rule.", "trap": "Different definitions produce different trades and results.", "lesson": 12}, {"term": "Retest", "category": "Patterns", "definition": "A return toward a previously breached area to observe how price behaves there.", "example": "Price breaks $20 resistance, then returns toward $20.", "trap": "A retest can fail; the level does not have to change roles.", "lesson": 12}, {"term": "Pullback", "category": "Patterns", "definition": "A counter-move within a larger move or trend. Whether it is temporary is uncertain in real time.", "example": "Price rallies from $30 to $33, then declines to $32.40.", "trap": "Calling a decline a pullback does not guarantee a recovery.", "lesson": 13}, {"term": "Bull flag", "category": "Patterns", "definition": "An upward impulse followed by a smaller consolidation often bounded by roughly parallel or slightly descending lines.", "example": "A $40 to $43 rise followed by a tight $42.30–$42.80 pause resembles a flag.", "trap": "The consolidation can become a reversal.", "lesson": 13}, {"term": "Bear flag", "category": "Patterns", "definition": "A downward impulse followed by a smaller sideways or upward consolidation.", "example": "A $50 to $47 drop followed by a small rising pause resembles a bear flag.", "trap": "Recognizing it does not require taking a short position.", "lesson": 13}, {"term": "Ascending triangle", "category": "Patterns", "definition": "A narrowing structure with roughly flat highs and rising lows.", "example": "Highs near $20 and lows of $18, $18.70 and $19.30.", "trap": "Its name does not guarantee an upward break.", "lesson": 14}, {"term": "Descending triangle", "category": "Patterns", "definition": "A narrowing structure with roughly flat lows and falling highs.", "example": "Lows near $20 and highs of $23, $22 and $21.", "trap": "It can break upward instead of downward.", "lesson": 14}, {"term": "Symmetrical triangle", "category": "Patterns", "definition": "A narrowing structure with falling highs and rising lows.", "example": "Highs 15, 14.5, 14 and lows 12, 12.5, 13.", "trap": "The geometry alone does not determine the breakout direction.", "lesson": 14}, {"term": "Pennant", "category": "Patterns", "definition": "A relatively small converging consolidation after a sharp directional impulse.", "example": "A fast rise followed by a tiny triangle can be described as a bullish pennant.", "trap": "Real examples often overlap with other labels.", "lesson": 14}, {"term": "Wedge", "category": "Patterns", "definition": "A converging pattern whose upper and lower boundaries both slope in the same general direction.", "example": "Both boundaries rise, but the lower one catches up with the upper one.", "trap": "Do not force lines through a chart that does not clearly support them.", "lesson": 14}, {"term": "Range", "category": "Patterns", "definition": "A period of two-sided movement between approximate lower and upper boundaries instead of a clear directional sequence.", "example": "Repeated movement between $48 and $50.", "trap": "A range can end in a sustained break.", "lesson": 15}, {"term": "Double bottom", "category": "Patterns", "definition": "Two similar troughs separated by a bounce; a common confirmation rule requires a break above the intervening high.", "example": "Lows at $25 and $25.20 with a bounce to $27 define a possible pattern.", "trap": "Buying the second low before confirmation is a different strategy.", "lesson": 16}, {"term": "Double top", "category": "Patterns", "definition": "Two similar peaks separated by a decline; a common confirmation rule requires a break below the intervening low.", "example": "Peaks near $40 with an intervening low near $37.", "trap": "Two peaks alone do not guarantee a decline.", "lesson": 16}, {"term": "Neckline", "category": "Patterns", "definition": "A reference line connecting or passing through intermediate swing points in reversal patterns.", "example": "In a double bottom, the high between the lows forms a neckline reference.", "trap": "A sloping line creates a time-dependent trigger; define it consistently.", "lesson": 16}, {"term": "Head-and-shoulders", "category": "Patterns", "definition": "Three peaks with the center higher than the outside peaks, often interpreted as a possible bearish reversal after a neckline break.", "example": "Shoulder $50, head $53, shoulder $51, with lows defining the neckline.", "trap": "A partial shape is not a confirmed reversal.", "lesson": 16}, {"term": "Inverse head-and-shoulders", "category": "Patterns", "definition": "Three troughs with the middle one lower than the outside troughs; a neckline break may be used as confirmation.", "example": "Troughs $30, $27 and $30.50, with intervening highs near $33.", "trap": "The neckline can fail after an apparent break.", "lesson": 16}, {"term": "Engulfing candle", "category": "Patterns", "definition": "A candle whose real body covers the prior candle’s real body under a stated definition; bullish and bearish versions differ by direction.", "example": "A bullish body from $9.90 to $10.60 covers a prior bearish body from $10.50 to $10.00.", "trap": "Body engulfing is not necessarily full-wick engulfing.", "lesson": 17}, {"term": "Doji", "category": "Patterns", "definition": "A candle whose open and close are very close together relative to an adopted definition.", "example": "Open $25 and close $25.01 with a high of $26 and low of $24.", "trap": "The small body can coexist with a large range.", "lesson": 17}, {"term": "Pin bar / hammer", "category": "Patterns", "definition": "A family of small-body, long-wick shapes; exact naming and interpretation depend on location and the chosen definition.", "example": "A long lower wick with a body near the high after a decline is hammer-like.", "trap": "The shape does not prove the next candle will rise.", "lesson": 17}, {"term": "Inside bar", "category": "Patterns", "definition": "A bar whose high and low lie within the preceding bar’s range under a strict or explicitly stated equality rule.", "example": "Previous range $20–$22; current range $20.50–$21.60.", "trap": "A contraction can break in either direction.", "lesson": 17}, {"term": "Liquidity sweep", "category": "Patterns", "definition": "An informal label often used for a brief move beyond an earlier high or low. This course focuses on observable breach-and-reclaim conditions.", "example": "Price dips below $50 then closes back above $50.", "trap": "The chart alone does not prove all stop locations or intentional stop hunting.", "lesson": 18}, {"term": "Reclaim", "category": "Patterns", "definition": "A return above or below a selected reference after price had crossed it, under a specified close or trade rule.", "example": "After dropping below $30, a completed close at $30.10 reclaims $30 under a close-based rule.", "trap": "A reclaim can fail on the next bar.", "lesson": 18}, {"term": "Break of structure (BOS)", "category": "Patterns", "definition": "A community term for breaching a chosen swing point. Definitions vary by timeframe and whether a wick or close is required.", "example": "A close beneath a selected higher low breaks that reference under a close rule.", "trap": "It does not by itself identify a hidden actor or ensure a reversal.", "lesson": 8}, {"term": "Fair value gap (FVG)", "category": "Patterns", "definition": "A community label often describing a three-bar non-overlap, such as the third low being above the first high in an upward move.", "example": "First high $10; third low $10.30: a $0.30 non-overlap under that definition.", "trap": "The label does not measure fundamental fair value or require a future fill.", "lesson": 18}, {"term": "Order block", "category": "Patterns", "definition": "A non-uniform community term for a selected price region, often a candle before a strong move. Treat the exact definition as a hypothesis.", "example": "A teacher marks the final down candle before an upward impulse.", "trap": "The candle does not reveal all institutional orders or guarantee support.", "lesson": 18}, {"term": "VWAP", "category": "Indicators", "definition": "A price average weighted by traded volume over a defined anchor period. Bar-based versions use an approximation such as typical price.", "example": "100 units at $10 and 300 at $12 produce $11.50 VWAP.", "trap": "Above VWAP is a historical relationship, not an automatic buy.", "lesson": 10}, {"term": "EMA", "category": "Indicators", "definition": "An exponential moving average: a recursive smoother that puts greater weight on newer observations.", "example": "With alpha 0.2, old EMA $50 and new close $51 give new EMA $50.20.", "trap": "The average lags and can whipsaw in a range.", "lesson": 11}, {"term": "RSI", "category": "Indicators", "definition": "An oscillator comparing smoothed recent gains and losses, commonly displayed on a 0–100 scale.", "example": "An RSI reading above a chosen threshold can describe strong recent upward momentum.", "trap": "“Overbought” does not mean a reversal must occur immediately.", "lesson": 11}, {"term": "ATR", "category": "Indicators", "definition": "Average true range: a summary of recent range and gap size under a selected lookback and smoothing rule.", "example": "Previous close $50, high $54, low $52 gives true range $4.", "trap": "ATR measures historical volatility, not direction or a maximum future move.", "lesson": 11}, {"term": "Divergence", "category": "Indicators", "definition": "A mismatch between price extremes and an indicator’s extremes under a defined comparison.", "example": "Price makes a higher high while RSI makes a lower high.", "trap": "It can precede continuation, consolidation or reversal; timing is uncertain.", "lesson": 11}, {"term": "Catalyst", "category": "Market mechanics", "definition": "An event or information change that may alter attention or expectations. Verify it using original sources where possible.", "example": "A company releases an earnings announcement.", "trap": "A rumor or promotional post is not verified evidence.", "lesson": 19}, {"term": "Opening range", "category": "Patterns", "definition": "The high and low of a chosen completed initial session window. The window must be chosen before testing the breakout.", "example": "The first three five-minute bars define a 15-minute opening range.", "trap": "You cannot know its final extremes before the window ends.", "lesson": 19}, {"term": "Confluence", "category": "Review", "definition": "Multiple observations pointing toward a similar interpretation. Their usefulness depends on independence and evidence.", "example": "A prior zone and an upward structure may align near an entry area.", "trap": "Five indicators calculated from the same price series are not five independent confirmations.", "lesson": 22}, {"term": "Backtesting", "category": "Review", "definition": "Applying a defined strategy to historical data using explicit information-timing, cost and execution assumptions.", "example": "Evaluate every qualifying setup in a chosen historical period.", "trap": "Knowing later candles can accidentally leak into earlier decisions.", "lesson": 24}, {"term": "Paper trading", "category": "Review", "definition": "Simulating orders, positions and results without committing real funds. This app also uses synthetic rather than live prices.", "example": "Buy 10 virtual units and observe simulated cash and P&L.", "trap": "Paper profit is not proof of live-market profitability.", "lesson": 24}, {"term": "Look-ahead bias", "category": "Review", "definition": "Using information in a test before it would have been available in real time.", "example": "Trading a confirmed swing two bars before its confirmation.", "trap": "Perfect historical chart labels can hide the timing problem.", "lesson": 24}, {"term": "Overfitting", "category": "Review", "definition": "Adapting rules so closely to one sample’s quirks that apparent performance may not generalize.", "example": "Trying dozens of settings and reporting only the best old result.", "trap": "More complexity can create a more convincing but less useful story.", "lesson": 24}, {"term": "Out-of-sample", "category": "Review", "definition": "Data reserved from strategy design and tuning, used for a later evaluation.", "example": "Design on one period, then evaluate once on a fresh period.", "trap": "Repeatedly tuning on the “test” set turns it into another training set.", "lesson": 24}, {"term": "FOMO", "category": "Review", "definition": "Fear of missing out: pressure to participate because a move or someone else’s result feels urgent.", "example": "Buying far above your planned entry because the chart is running.", "trap": "Urgency does not improve the entry’s risk math.", "lesson": 25}, {"term": "Revenge trading", "category": "Review", "definition": "Taking new or larger risk primarily to recover a recent loss or repair the emotion attached to it.", "example": "Doubling quantity immediately after a stop-out without a valid new setup.", "trap": "The next trade does not owe you the money from the last one.", "lesson": 25}, {"term": "Settled cash / T+1", "category": "Market mechanics", "definition": "Settled cash reflects completed payment processing. Most U.S. equity trades currently settle the next business day; account rules still matter.", "example": "A Monday trade ordinarily settles Tuesday if both are business days.", "trap": "This simulator reuses sale cash immediately and does not enforce real settlement rules.", "lesson": 26}, {"term": "Basis point (bp)", "category": "Orders & risk", "definition": "One hundredth of one percentage point. One hundred basis points equals 1%.", "example": "8 bp = 0.08%; on $50 that full spread is $0.04.", "trap": "Do not confuse 8 bp with 8%.", "lesson": 5}, {"term": "Rug pull", "category": "Market mechanics", "definition": "A broad crypto-community term for a project failure or scam in which insiders remove liquidity, abuse control or abandon users. Mechanisms differ.", "example": "A developer-controlled pool can lose liquidity abruptly.", "trap": "Distribution maps and verification badges cannot establish near-perfect scam prevention.", "lesson": 21}, {"term": "Holder / bubble map", "category": "Market mechanics", "definition": "A visual representation of holder distribution and sometimes wallet relationships based on observed on-chain data and a tool’s assumptions.", "example": "A cluster can suggest related wallets worth investigating.", "trap": "A cluster is not definitive identity evidence, and a clean-looking map is not proof of safety.", "lesson": 21}], "patterns": [{"name": "Breakout + retest", "tag": "Continuation hypothesis", "lesson": 12, "lab": 0, "path": [18, 35, 28, 40, 28, 40, 30, 40, 59, 50, 44, 52, 66, 78], "levels": [40], "desc": "A boundary breaks, price revisits it, then a defined tri
