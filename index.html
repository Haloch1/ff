 <div class="rule"></div><h3>Sources & further reading</h3><div class="source-chips">${sourceChips(l.refs)}</div><p class="muted">Examples and teaching rules are original illustrations, not source-endorsed trading strategies.</p></article>
 <aside class="reader-aside"><div class="card flat"><div class="eyebrow">IN THIS LESSON</div>${l.sections.map((s,i)=>`<a href="#section-${i}" data-action="scroll-section" data-id="section-${i}">${s.title}</a>`).join('')}<a href="#diy" data-action="scroll-section" data-id="diy">Do it yourself</a><a href="#quiz" data-action="scroll-section" data-id="quiz">Knowledge check</a><div class="rule"></div>${link('Search the glossary →','glossary','')}<p class="muted">A pattern is a hypothesis. Risk and context come first.</p></div></aside></div>`;}
function patternView(){return header('Pattern library','A shape gives you a question to investigate—not an instruction to buy.')+`<div class="callout bottomgap">These are simplified silhouettes, not real charts. A familiar pattern does not establish an edge. Bearish patterns here teach recognition and exits; the simulator never sells short.</div><div class="grid three">${patterns.map((p,i)=>`<article class="card pattern-card"><div class="pattern-preview">${miniSVG(p.path,p.levels,'pat-'+i)}</div><span class="eyebrow">${p.tag}</span><h2>${p.name}</h2><p>${p.desc}</p><p><strong>Possible trigger</strong><br>${p.trigger}</p><p><strong>What invalidates it?</strong><br>${p.invalid}</p><p class="muted"><strong>Common trap</strong><br>${p.mistake}</p><div class="actions">${link('Read lesson',`lesson/${p.lesson}`,'btn compact')}${p.lab!==null?btn('Try replay','open-lab','compact',`data-id="${p.lab}"`):''}</div></article>`).join('')}</div>`;}
function glossaryView(){const cats=[...new Set(glossary.map(g=>g.category))];return header('The glossary','92 terms, with an explanation, a concrete example, and a misconception to avoid.')+`<div class="searchrow"><label class="searchbox">${ico('search')}<input class="search-input" id="term-search" type="search" value="${esc(V.termSearch)}" placeholder="Try liquidity, candle, VWAP, or stop…" aria-label="Search glossary"></label><select id="term-category" class="select-filter" aria-label="Glossary category"><option>All</option>${cats.map(c=>`<option ${V.termCategory===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="glossary-results">${glossaryResults()}</div>`;}
function glossaryResults(){const q=V.termSearch.toLowerCase(),gs=glossary.filter(g=>(V.termCategory==='All'||g.category===V.termCategory)&&(!q||[g.term,g.definition,g.example].join(' ').toLowerCase().includes(q)));return `<p class="muted">${gs.length} term${gs.length===1?'':'s'}</p><div class="grid two">${gs.map(g=>`<article class="card term-card"><span class="category">${g.category}</span><h2>${g.term}</h2><p>${g.definition}</p><div class="example"><strong>For example</strong><p>${g.example}</p></div><p class="muted"><strong>Don’t confuse this with…</strong><br>${g.trap}</p>${link('Learn it in context →',`lesson/${g.lesson}`,'link')}</article>`).join('')||'<div class="empty">No matches. Try a shorter term.</div>'}</div>`;}
function riskCalculator(){return `<section class="card" id="risk-calculator"><div class="eyebrow">POSITION-SIZE WORKSHOP</div><h2>Choose a planned loss before a size.</h2><p>Long-only arithmetic, with a cash cap and an estimated round-trip cost per unit. This is a teaching calculation—not a recommended risk percentage.</p><form id="risk-form" class="calc-fields" onsubmit="return false">${field('Virtual account equity ($)','equity',10000,'number','min="1" step="1"')}${field('Available cash ($)','cash',10000,'number','min="0" step="1"')}${field('Example risk budget (%)','riskPct',.25,'number','min="0.01" max="100" step="0.05"')}${field('Planned entry ($)','entry',50,'number','min="0.01" step="0.01"')}${field('Protective stop ($)','stop',49.5,'number','min="0.01" step="0.01"')}${field('Target ($)','target',51,'number','min="0.01" step="0.01"')}${field('Total cost allowance per unit ($)','cost',.04,'number','min="0" step="0.01"')}</form><div id="risk-output" class="calc-result" aria-live="polite"></div><p class="muted">Quantity = the smaller of risk-limited units and cash-affordable units. Actual gaps, slippage and fees can exceed your allowance. A stop does not guarantee the planned loss.</p></section>`;}
function updateRisk(){const f=$('#risk-form');if(!f)return;const inp=Object.fromEntries([...new FormData(f)].map(([k,v])=>[k,Number(v)]));try{const r=E.riskCalc(inp);$('#risk-output').innerHTML=`<div class="big">${num(r.qty)} <small>whole units</small></div><div class="grid two"><div>Planned loss including allowance<br><strong>${money(r.planned)}</strong> of ${money(r.budget)} budget</div><div>Target net reward / planned loss<br><strong>${r.rr.toFixed(2)} : 1</strong></div><div>Position value<br><strong>${money(r.notional)}</strong></div><div>Target net gain (if filled as planned)<br><strong>${money(r.reward)}</strong></div></div>${r.qty===0?'<p class="negative">The budget cannot afford one unit under these inputs. The calculation says skip or revise the setup—not borrow.</p>':''}`;}catch(e){$('#risk-output').innerHTML=`<p class="negative">${esc(e.message)}</p>`;}}
function candleBuilder(){return `<section class="card"><div class="eyebrow">CANDLE WORKSHOP</div><h2>Build one candle.</h2><p>A candle is a summary of trades in one period. Change the four numbers and watch its story change.</p><div class="candle-builder"><div><svg id="candle-svg" viewBox="0 0 240 220" role="img" aria-label="Interactive candle diagram"></svg></div><form id="candle-form" class="calc-fields" onsubmit="return false">${field('Open ($)','o',50,'number','min="0.01" step="0.1"')}${field('High ($)','h',52,'number','min="0.01" step="0.1"')}${field('Low ($)','l',49,'number','min="0.01" step="0.1"')}${field('Close ($)','c',51.5,'number','min="0.01" step="0.1"')}</form></div><div id="candle-output" class="callout" aria-live="polite"></div></section>`;}
function updateCandle(){const f=$('#candle-form');if(!f)return;const b=Object.fromEntries([...new FormData(f)].map(([k,v])=>[k,Number(v)]));if(!Object.values(b).every(x=>Number.isFinite(x)&&x>0)||b.h<Math.max(b.o,b.c)||b.l>Math.min(b.o,b.c)||b.h<=b.l){$('#candle-output').textContent='High must be at least the open and close; low must be at most both. Use positive prices and a high above the low.';$('#candle-svg').innerHTML='';return;}const y=v=>185-(v-b.l)/(b.h-b.l)*155,up=b.c>=b.o;$('#candle-svg').innerHTML=`<line x1="88" y1="${y(b.h)}" x2="88" y2="${y(b.l)}" stroke="${up?'var(--accent)':'var(--red)'}" stroke-width="3"/><rect x="66" y="${Math.min(y(b.o),y(b.c))}" width="44" height="${Math.max(2,Math.abs(y(b.c)-y(b.o)))}" fill="${up?'var(--panel)':'var(--red)'}" stroke="${up?'var(--accent)':'var(--red)'}" stroke-width="3"/>${[['High',b.h],['Open',b.o],['Close',b.c],['Low',b.l]].map(([k,v],i)=>`<text x="130" y="${28+i*48}" fill="var(--muted)" font-size="13">${k} ${money(v)}</text>`).join('')}`;$('#candle-output').innerHTML=`<strong>${b.c>b.o?'An up candle':b.c<b.o?'A down candle':'Open equals close'}</strong>: opened at ${money(b.o)}, reached ${money(b.h)} and ${money(b.l)}, and closed at ${money(b.c)}. Body: ${money(Math.abs(b.c-b.o))}. Total range: ${money(b.h-b.l)}. <strong>These numbers do not tell you whether the high or the low happened first.</strong>`;}
function expectancyCalc(){return `<section class="card topgap"><div class="eyebrow">EXPECTANCY WORKSHOP</div><h2>A high win rate is not the whole story.</h2><p>Use gross average wins and losses per trade. Costs are subtracted once from every trade.</p><form id="expectancy-form" class="calc-fields" onsubmit="return false">${field('Example win rate (%)','win',45,'number','min="0" max="100" step="1"')}${field('Average gross win ($)','gain',60,'number','min="0" step="1"')}${field('Average gross loss ($)','loss',30,'number','min="0" step="1"')}${field('Average total costs per trade ($)','cost',3,'number','min="0" step="0.1"')}</form><div class="calc-result" id="expectancy-output" aria-live="polite"></div><p class="muted">An assumed or small-sample average is not a proven edge. Market conditions change; losing streaks and large tail losses matter.</p></section>`;}
function updateExpectancy(){const f=$('#expectancy-form');if(!f)return;const a=Object.fromEntries([...new FormData(f)].map(([k,v])=>[k,Number(v)]));if(!Object.values(a).every(Number.isFinite)||a.win<0||a.win>100||a.gain<0||a.loss<0||a.cost<0){$('#expectancy-output').textContent='Use a win rate from 0 to 100 and nonnegative amounts.';return;}const ex=a.win/100*a.gain-(1-a.win/100)*a.loss-a.cost,be=a.gain+a.loss?(a.loss+a.cost)/(a.gain+a.loss)*100:null;$('#expectancy-output').innerHTML=`<div class="big ${pnl(ex)}">${signed(ex)} <small>per trade, under these assumptions</small></div><p>${a.win}% × ${money(a.gain)} − ${100-a.win}% × ${money(a.loss)} − ${money(a.cost)} = ${money(ex)}.</p><p>Break-even win rate with these fixed averages: <strong>${be===null?'undefined':be.toFixed(1)+'%'}${be>100?' (not achievable with these payoffs)':''}</strong>.</p>`;}
function toolsView(){return header('Calculators','Slow the decision down. Make the arithmetic visible.')+riskCalculator()+`<div class="topgap">${candleBuilder()}</div>`+expectancyCalc();}
function newLab(id=0){stopTimers();const l=labs[id];V.lab={id,at:l.pause,qty:Math.max(1,Math.min(Math.floor(25/(l.bars[l.pause].c-l.stop+.06)),Math.floor(10000/l.bars[l.pause].c))),stop:l.stop,target:l.target,plan:'',position:null,events:[],decision:null,net:0,done:false,saved:false,reveal:false,process:'',exitReason:''};}
function labControls(){const v=V.lab,l=labs[v.id],atEnd=v.at>=l.bars.length-1;return `<div class="replay-controls">${btn('Next candle →','lab-next','','type="button" '+(atEnd?'disabled':''))}${btn(labTimer?`${ico('pause')} Pause`:`${ico('replay')} Play`,'lab-play','',atEnd?'disabled':'')}${btn('Reveal remaining','lab-reveal','ghost',!v.decision||atEnd?'disabled':'')}${btn('Restart','lab-reset','ghost')}</div>`;}
function labView(){if(!V.lab)newLab(0);const v=V.lab,l=labs[v.id];return header('Chart replay','The future is hidden. Your job is to make a defensible decision—not guess the ending.',`<span class="badge purple">SYNTHETIC SCENARIOS</span>`)+`<div class="lab-toolbar"><label class="field"><span>Choose a checkpoint</span><select id="lab-select">${labs.map((x,i)=>`<option value="${i}" ${i===v.id?'selected':''}>${x.name} · ${x.pattern}</option>`).join('')}</select></label><div class="tabs" role="group" aria-label="Replay instruction mode">${['guided','practice'].map(mode=>btn(mode==='guided'?'Guided':'Practice','lab-mode',V.labMode===mode?'active':'',`data-mode="${mode}"`)).join('')}</div></div><div class="lab-layout"><div><div class="card lab-card"><div class="chart-title"><div><span class="eyebrow">${l.pattern.toUpperCase()}</span><h2>${l.name}</h2></div><span class="badge">CANDLE ${v.at+1} / ${l.bars.length}</span></div><div class="chart-data"><strong>${money(l.bars[v.at].c)}</strong><span>${v.at===l.pause?'Paused at the decision point':v.at>=l.bars.length-1?'All candles revealed':'Replaying · future still hidden'}</span></div>${chartHTML('lab-chart','replay')}<div class="mobile-only topgap">${btn('Jump to the trade plan ↓','scroll-plan','primary compact')}</div>${labControls()}<details class="topgap"><summary>Inspect the visible candle data</summary>${candleTable(l.bars.slice(0,v.at+1),true)}</details></div><div class="callout topgap"><strong>At the checkpoint:</strong> ${l.context}</div>${v.done?labDebrief():`<div class="card soft topgap"><h3>Keep the decision separate from the outcome.</h3><p>Some checkpoints look identical until the future changes. A loss does not automatically mean the decision was wrong; a win does not excuse a broken plan.</p></div>`}</div><aside class="lab-copy"><div class="card"><span class="eyebrow">${V.labMode==='guided'?'GUIDED PRACTICE':'YOUR DECISION'}</span><h2>${v.position?'Manage your open position':v.decision==='skip'?'You chose not to enter':v.decision?'Review, don’t rewrite':'Plan before you click'}</h2>${V.labMode==='guided'&&!v.decision?`<p>${l.guide}</p>`:!v.decision?'<p>Use the visible price action to decide: enter, wait, or skip. Write the reason first.</p>':''}
 ${v.position?`<div class="decision-status"><strong>${v.position.qty} units · entry ${money(v.position.entry,4)}</strong><p>Stop ${money(v.position.stop)} · target ${money(v.position.target)}</p><p>Current marked result, after entry fee but before exit costs: <strong class="${pnl((l.bars[v.at].c-v.position.entry)*v.position.qty-v.position.fee)}">${signed((l.bars[v.at].c-v.position.entry)*v.position.qty-v.position.fee)}</strong></p></div>${btn('Exit now at modeled market price','lab-exit','wide')}<p class="muted">An exit uses the current close less $0.02 slippage, plus $0.01 per unit fee.</p>`:!v.decision?`<form id="lab-plan" data-form="lab-buy" class="plan-form">${field('Whole units','qty',v.qty,'number','min="1" max="10000" step="1" required')}${field('Protective stop ($)','stop',v.stop,'number','min="0.01" step="0.01" required')}${field('Target ($)','target',v.target,'number','min="0.01" step="0.01" required')}<label class="field full"><span>Why this trade? What would prove it wrong?</span><textarea name="plan" rows="3" maxlength="6000" placeholder="My trigger is… I will skip if…">${esc(v.plan)}</textarea></label><button class="btn primary full" type="submit">Buy at the next candle’s open</button></form><div class="actions topgap">${btn('Wait one candle','lab-next')}${btn('Skip this setup','lab-skip')}</div><details class="hint"><summary>Show a thinking hint</summary><p>${l.hint}</p></details>`:`<div class="decision-status"><strong>${v.decision==='skip'?'No position opened.':'Position closed.'}</strong><p>${v.decision==='skip'?'Continue the replay to see why the outcome does not decide whether skipping was sensible.':`${esc(v.exitReason)}. Net result: <span class="${pnl(v.net)}">${signed(v.net)}</span>.`}</p></div>`}
 <div class="rule"></div><p class="muted"><strong>Replay model:</strong> $10,000 of separate notional cash, no borrowing. Market entries fill at the next unseen open + $0.02. Market/stop exits subtract $0.02. Every fill costs $0.01 per unit. Targets are limit exits. If a candle touches both stop and target and the order is unknown, the stop wins. Future prices never depend on your click.</p><p class="muted">This exercise does not change your Paper portfolio. Active replay decisions restart when you reload; finished reviews are saved.</p>${link('Read the linked lesson →',`lesson/${l.lesson}`,'')}</div></aside></div><div class="section-title topgap"><h2>Your replay notebook</h2><span class="muted">${S.labHistory.length} completed</span></div>${labHistoryHTML()}`;}
function inlineReplay(id){if(!V.lab||V.lab.id!==id)newLab(id);const v=V.lab,l=labs[id];return `<section class="inline-replay" id="inline-replay"><div class="eyebrow">DO IT YOURSELF / INTERACTIVE CHART</div><h2>Make a decision before the reveal.</h2><p>${l.context}</p><div class="lab-card"><div class="spread"><strong>${l.name} · ${l.pattern}</strong><span class="badge">${v.at+1} / ${l.bars.length}</span></div>${chartHTML('inline-chart','replay')}${labControls()}</div>${!v.decision?`<p class="replay-note">${l.guide}</p><form id="lab-plan" data-form="lab-buy" class="plan-form">${field('Whole units','qty',v.qty,'number','min="1" step="1" required')}${field('Protective stop ($)','stop',v.stop,'number','min="0.01" step="0.01" required')}${field('Target ($)','target',v.target,'number','min="0.01" step="0.01" required')}<label class="field full"><span>Explain your entry or your reason to skip</span><textarea name="plan" rows="3" maxlength="6000" placeholder="I see… My idea fails if…">${esc(v.plan)}</textarea></label><div class="replay-action-row full"><button class="btn primary" type="submit">Buy at next candle’s open</button>${btn('Skip this setup','lab-skip','','type="button"')}</div></form><details class="hint"><summary>Thinking hint</summary><p>${l.hint}</p></details>`:v.position?`<div class="decision-status">Holding ${v.position.qty} units from ${money(v.position.entry,4)}. Stop ${money(v.position.stop)}, target ${money(v.position.target)}.</div>${btn('Exit now at modeled market','lab-exit')}`:`<div class="decision-status">${v.decision==='skip'?'No position opened.':`Position closed: ${esc(v.exitReason)}. Net ${signed(v.net)}.`} Advance or reveal the remaining candles to complete the review.</div>`}${v.done?labDebrief():''}<details class="topgap"><summary>Exercise fill rules and visible candle data</summary><p class="muted">A separate $10,000 notional account. Entry: next unseen open + $0.02. Market/stop exit: reference price − $0.02. Every fill costs $0.01 per unit. Targets are limit exits; unknown same-bar stop/target order is resolved stop-first. Full fills assumed. No paper-wallet transactions are created. Finished reviews save; an unfinished replay resets on reload.</p>${candleTable(l.bars.slice(0,v.at+1),true)}</details><div class="actions topgap">${btn('Open the full replay workspace','open-lab','ghost',`data-id="${id}"`)}</div></section>`;}
function chartHTML(id,kind){return `<div class="chart-shell"><canvas id="${id}" data-chart="${kind}" tabindex="0" role="img" aria-label="Interactive candlestick chart. Tap a candle or use left and right arrow keys to inspect its values."></canvas></div><div class="chart-meta" id="${id}-meta">Tap a candle to inspect its open, high, low, close and volume.</div><div class="chart-legend"><span><i class="key"></i>Up (hollow)</span><span><i class="key down"></i>Down (filled)</span><span><i class="key line"></i>Reference level</span></div>`;}
function candleTable(bars,isLab=false){return `<div class="table-wrap"><table><thead><tr><th>${isLab?'Candle':'Synthetic time'}</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Volume</th></tr></thead><tbody>${bars.slice(-8).map((b,i)=>`<tr><td>${isLab?bars.length-Math.min(8,bars.length)+i+1:E.clock(b.t)}</td>${['o','h','l','c'].map(k=>`<td>${num(b[k],4)}</td>`).join('')}<td>${num(b.v)}</td></tr>`).join('')}</tbody></table></div>`;}
function captureLab(){const f=$('#lab-plan');if(f){const a=Object.fromEntries(new FormData(f));Object.assign(V.lab,{qty:Number(a.qty),stop:Number(a.stop),target:Number(a.target),plan:a.plan});}}
function labBuy(){captureLab();const v=V.lab,l=labs[v.id];if(v.decision||v.at>=l.bars.length-1)throw Error('Restart this checkpoint to make a new entry.');if(!Number.isInteger(v.qty)||v.qty<1||!Number.isFinite(v.stop)||!Number.isFinite(v.target)||v.stop<=0||v.stop>=l.bars[v.at].c||v.target<=l.bars[v.at].c)throw Error('Use whole units, a stop below the visible close, and a target above it.');
 const next=l.bars[v.at+1],entry=E.round(next.o+.02),fee=v.qty*.01;if(entry*v.qty+fee>10000)throw Error('This entry exceeds the $10,000 notional cash. Reduce the quantity.');v.at++;v.decision='buy';v.position={qty:v.qty,entry,stop:v.stop,target:v.target,fee,initialRisk:v.qty*(entry-v.stop+.04)};
 if(v.stop>=entry||v.target<=entry){v.position=null;v.decision='skip';v.exitReason='The next opening price invalidated the planned price geometry; no order was filled.';toast(v.exitReason);}else{v.events.push({side:'buy',tick:v.at,price:entry,qty:v.qty});labEvaluate(next);}
 labMaybeDone();render(true);if(innerWidth<761)requestAnimationFrame(()=>$('.lab-card')?.scrollIntoView({behavior:'smooth'}));
}
function labExitAt(price,reason){const v=V.lab,p=v.position;if(!p)return;v.net=E.round(p.qty*(price-p.entry)-p.fee-p.qty*.01,2);v.initialRisk=p.initialRisk;v.events.push({side:'sell',tick:v.at,price,qty:p.qty});v.exitReason=reason;v.position=null;}
function labEvaluate(b){const v=V.lab,p=v.position;if(!p)return;if(b.o<=p.stop)return labExitAt(Math.max(.0001,b.o-.02),'Gap through the stop');if(b.o>=p.target)return labExitAt(Math.max(p.target,b.o-.02),'Target reached at the open');if(b.l<=p.stop)return labExitAt(Math.max(.0001,p.stop-.02),b.h>=p.target?'Both levels touched; conservative stop-first exit':'Protective stop');if(b.h>=p.target)return labExitAt(p.target,'Target limit filled');}
function labStep(){captureLab();const v=V.lab,l=labs[v.id];if(v.at>=l.bars.length-1){labMaybeDone();return false;}v.at++;labEvaluate(l.bars[v.at]);labMaybeDone();return true;}
function labMaybeDone(){const v=V.lab,l=labs[v.id];if(v.at<l.bars.length-1)return;clearInterval(labTimer);labTimer=null;if(v.position)labExitAt(Math.max(.0001,l.bars[v.at].c-.02),'End-of-exercise market exit');if(!v.decision)v.decision='skip';v.done=true;
 if(!v.saved){v.process=(v.plan.trim()?'You wrote a pre-trade reason. ':'You did not write a pre-trade reason; add one next time. ')+(v.decision==='skip'?'You chose to preserve the option not to trade.':`Your entry had a defined stop and target. ${v.initialRisk?`Initial modeled risk was ${money(v.initialRisk)}; ${v.initialRisk>25?'above':'within'} the $25 teaching budget. `:''}`)+(l.recommended==='skip'?'At the original checkpoint, the nearby ceiling and distant invalidation made the risk geometry unattractive.':'The original checkpoint offered a pattern hypothesis, not a guaranteed edge.');
 S.labHistory.unshift({id:E.uid(),scenario:v.id,decision:v.decision,net:v.net,plan:v.plan,process:v.process,created:new Date().toISOString()});S.labHistory=S.labHistory.slice(0,3000);v.saved=true;save();}
}
function labDebrief(){const v=V.lab,l=labs[v.id];return `<section class="debrief"><span class="eyebrow">THE REVIEW</span><h2>${v.decision==='skip'?'No trade is a valid decision.':'The result is only one part of the story.'}</h2><p>${l.debrief}</p><p>${esc(v.process)}</p>${v.decision==='buy'?`<p>Net result: <strong class="${pnl(v.net)}">${signed(v.net)}</strong>${v.initialRisk?` · ${ (v.net/v.initialRisk).toFixed(2)} R using the entry’s modeled initial risk`:''}. ${esc(v.exitReason)}.</p>`:''}<div class="actions">${btn('Save a reflection in Journal','lab-journal')}${btn('Next checkpoint','lab-nextcase','primary')}</div><p class="muted">These endings were authored to teach uncertainty. Their win/loss frequency says nothing about real pattern success rates.</p></section>`;}
function labHistoryHTML(){return S.labHistory.slice(0,10).map(h=>`<div class="card journal-entry"><div class="spread"><div><strong>${labs[h.scenario].name} · ${labs[h.scenario].pattern}</strong><div class="entry-meta">${date(h.created)} · ${h.decision==='skip'?'Skipped':`Bought · net ${signed(h.net)}`}</div></div>${btn('Delete','delete-lab','ghost compact',`data-id="${h.id}"`)}</div><p>${esc(h.process)}</p>${h.plan?`<p class="muted">Your plan: ${esc(h.plan)}</p>`:''}</div>`).join('')||'<div class="empty">Complete a replay to save a decision here. The outcome is less important than what you knew when you acted.</div>';}
function modelRules(){return `<details class="card soft topgap"><summary><strong>How this simulator fills orders—and what it leaves out</strong></summary><div class="topgap"><p><strong>Fictional prices only.</strong> Three generated instruments share a compressed, synthetic 78-bar day. Every candle is five minutes. The model is long-only, whole units, no leverage, and one position or pending entry per symbol. Even the fictional token is forced into this training session schedule.</p><p><strong>Market entries</strong> use the current completed candle’s close, half the modeled bid–ask spread, and adverse slippage. Fees apply to every fill. Pending buy limits fill at the limit or a better opening price; a touched limit is assumed filled. Buy stops become modeled market fills when triggered.</p><p><strong>Exits:</strong> a protective stop can fill worse through a gap. A target is a limit exit, not a guaranteed fill in real life. If both levels are touched and the intrabar order is unknown, this model exits at the stop. For an intrabar pending entry, a same-bar target receives no credit unless entry occurred at the open; a possible stop is still applied conservatively.</p><p><strong>Session close:</strong> all positions are sold using modeled closing quotes, and pending entries expire. A single next-candle step from the close enters the next synthetic session.</p><p><strong>Important omissions:</strong> no real order book, queue, partial fills, halts, variable liquidity, borrow costs, taxes, or broker suitability rules. Sale cash is reusable immediately here; real cash-account settlement and trading restrictions are <em>not</em> modeled. Hypothetical results do not establish profitability, compliance, or Shariah permissibility.</p><p><strong>History edits:</strong> deleting fills rewrites this practice record and marks it edited. Dependent invalid fills are removed, all active entries and protective exits are canceled, and balances are rebuilt. Export an untouched backup before editing data used for evaluation.</p>${link('Read the order lesson →','lesson/5','')}</div></details>`;}
function paperView(){const p=S.paper,m=E.metrics(p);return header('Paper portfolio','Your virtual trading desk. Three fictional instruments. Every cost accounted for.',`<span class="badge ${p.edits?'warn':'green'}">${p.edits?'EDITED PRACTICE RECORD':'SIMULATED · NO REAL MONEY'}</span>`)+`<div class="wallet-head"><div><div class="wallet-label">TOTAL VIRTUAL EQUITY</div><div class="wallet-amount">${money(m.equity)}</div><span class="${pnl(m.net)}">${signed(m.net)}</span> <span class="muted">since account reset · before any tax</span></div><div class="actions">${link('Account settings','settings')}${btn('Export fills','csv')}</div></div><div class="tabs bottomgap">${['desk','portfolio','history'].map(t=>btn(t[0].toUpperCase()+t.slice(1),'paper-tab',V.paperTab===t?'active':'',`data-tab="${t}"`)).join('')}</div>${V.paperTab==='desk'?paperDesk(p,m):V.paperTab==='portfolio'?portfolioView(p,m):historyView(p,m)}${modelRules()}`;}
function paperDesk(p,m){const s=p.symbol,q=E.quotes(p,s),bar=E.bars(p,s)[p.tick],pos=m.positions[s],br=p.brackets[s],draft=V.ticketDraft||{};return `<div class="ticker-strip">${Object.entries(E.SYMBOLS).map(([key,meta])=>{const bs=E.bars(p,key),b=bs[p.tick],prev=bs[Math.max(0,p.tick-1)].c;return `<button class="ticker-card ${s===key?'active':''}" data-action="symbol" data-symbol="${key}"><span>${key}<small>${meta.kind}</small></span><strong>${money(b.c)}</strong><span class="${pnl(b.c-prev)}">${((b.c-prev)/prev*100).toFixed(2)}%</span></button>`;}).join('')}</div><div class="desk-grid"><div class="desk-main"><div class="card lab-card"><div class="chart-title"><div><span class="eyebrow">${E.SYMBOLS[s].name.toUpperCase()} · ${s} · 5 MIN</span><h2>${money(bar.c,4)}</h2></div><div><span class="badge">${E.clock(p.tick)}</span><small class="muted">${p.tick%78===77?'Session closed':'Synthetic session'}</small></div></div><div class="chart-tools"><label class="check"><input id="show-ema" type="checkbox" ${V.showEMA?'checked':''}> EMA 9</label><label class="check"><input id="show-vwap" type="checkbox" ${V.showVWAP?'checked':''}> Session VWAP</label><span class="muted">Bid ${money(q.bid,4)} / Ask ${money(q.ask,4)}</span></div>${chartHTML('paper-chart','paper')}<div class="mobile-only topgap">${btn('Open order ticket ↓','scroll-plan','primary compact')}</div><div class="replay-controls">${btn('Next candle →','paper-next','','data-count="1"')}${btn('+5 candles','paper-next','','data-count="5"')}${btn(paperTimer?`${ico('pause')} Pause`:`${ico('replay')} Play`,'paper-play')}${btn('Inspect portfolio','paper-tab','ghost','data-tab="portfolio"')}</div><details class="topgap"><summary>Visible candle data</summary>${candleTable(E.bars(p,s))}</details></div>
 <div class="stats topgap">${stat('Available cash',money(m.cash-m.reserved),'Cash minus pending reserves')}${stat('Realized P&L',`<span class="${pnl(m.realized)}">${signed(m.realized)}</span>`,'After allocated entry and exit fees')}${stat('Fees paid',money(m.fees),'Spread/slippage are in fill prices')}</div><div class="section-title"><h2>Open positions</h2><span class="muted">${m.open.length} / 3</span></div>${positionsHTML(p,m)}<div class="section-title topgap"><h2>Pending entries</h2></div>${pendingHTML(p)}
 <details class="topgap card flat"><summary>Recent simulator messages</summary><div class="notice-list">${p.notices.slice(-8).reverse().map(n=>`<p><strong>${E.clock(n.tick)}</strong> ${esc(n.text)}</p>`).join('')||'<p>No activity yet.</p>'}</div></details></div><aside class="order-ticket"><div class="card"><div class="ticket-label"><span class="eyebrow">PRACTICE ORDER</span><span class="badge">${s}</span></div><h2>Plan the whole trade.</h2><div class="mobile-only">${btn('Back to the chart ↑','scroll-chart','compact ghost')}</div><p class="muted">Use your plan, not a buy signal. Orders here never leave this page.</p>${pos.qty||p.orders.some(o=>o.symbol===s)?`<div class="callout">This symbol already has ${pos.qty?'an open position':'a pending entry'}. Close it or cancel the entry before opening another. Adding to positions is disabled in this practice model.</div>`:`<form data-form="paper-order" id="paper-order"><label class="field"><span>Entry order type</span><select name="type" id="order-type">${[['market','Market buy now'],['limit','Buy limit (at or below price)'],['stop','Buy stop (above the ask)']].map(([k,l])=>`<option value="${k}" ${V.ticketType===k?'selected':''}>${l}</option>`).join('')}</select></label><div class="ticket-fields">${field('Quantity (whole units)','qty',draft.qty??10,'number','min="1" max="10000000" step="1" required')}<div id="entry-price-field" ${V.ticketType==='market'?'hidden':''}>${field('Entry limit / trigger ($)','price',draft.price??E.round(q.mid+(V.ticketType==='limit'?-.2:.2),2),'number','min="0.0001" step="0.0001"')}</div>${field('Protective stop ($) · optional','stop',draft.stop??'','number','min="0.0001" step="0.0001" placeholder="Plan invalidation"')}${field('Target limit ($) · optional','target',draft.target??'','number','min="0.0001" step="0.0001" placeholder="Plan an exit"')}</div><label class="field"><span>Why am I entering?</span><textarea name="note" rows="3" maxlength="2000" placeholder="Setup, trigger, invalidation, and reason to skip…">${esc(draft.note||'')}</textarea></label><div class="order-preview" id="order-preview" aria-live="polite"></div><button class="btn primary wide" type="submit">Place virtual buy order</button></form>`}<div class="rule"></div><p class="muted">Costs: ${p.settings.feePct}% fee per fill · ${p.settings.spreadBps} basis-point full spread · ${p.settings.slipBps} basis-point adverse market slippage. One basis point = 0.01%.</p>${link('Size a trade with the calculator →','tools','')}</div></aside></div>`;}
function updateTicket(){const f=$('#paper-order');if(!f)return;const a=Object.fromEntries(new FormData(f)),p=S.paper,q=E.quotes(p,p.symbol),qty=Number(a.qty),entry=a.type==='market'?q.buy:Number(a.price),amount=qty*entry,fee=E.fee(p,entry,qty);const fp=$('#entry-price-field');if(fp)fp.hidden=a.type==='market';if(!Number.isFinite(amount)||qty<1||entry<=0){$('#order-preview').textContent='Enter a positive quantity and entry price.';return;}const stop=a.stop===''?null:Number(a.stop);$('#order-preview').innerHTML=`<div class="spread"><span>Estimated ${a.type==='market'?'spend':'entry value'}</span><strong>${money(amount+fee)}</strong></div><div class="spread"><span>Estimated entry fee</span><span>${money(fee)}</span></div>${stop!==null&&stop<entry?`<div class="spread"><span>Modeled stop-loss amount</span><strong>${money(qty*(entry-E.quotes(p,p.symbol,stop).sell)+fee+E.fee(p,E.quotes(p,p.symbol,stop).sell,qty))}</strong></div>`:'<p>No valid stop below entry is set. The loss is not capped.</p>'}<small>Pending prices, gaps and slippage can change the eventual fill. Targets and stops are not guarantees.</small>`;}
function positionsHTML(p,m){if(!m.open.length)return '<div class="empty">No positions. Staying in virtual cash is a valid choice.</div>';return m.open.map(o=>{const br=p.brackets[o.symbol];return `<div class="card position-row"><div class="spread"><div><strong>${o.symbol} · ${num(o.qty)} units</strong><div class="muted">Average cost ${money(o.avg,4)} including buy fees · Mark ${money(o.price,4)}</div></div><strong class="${pnl(o.unrealized)}">${signed(o.unrealized)}</strong></div><p class="muted">${br?`Stop ${br.stop===null?'none':money(br.stop)} · Target ${br.target===null?'none':money(br.target)}. Applies to remaining units.`:'No protective exits are currently attached.'}</p><form data-form="sell" data-symbol="${o.symbol}" class="actions">${field('Units to sell','qty',o.qty,'number',`min="1" max="${o.qty}" step="1" required`)}<button class="btn" type="submit">Sell at modeled market</button>${btn('Set exits','edit-bracket','ghost compact',`data-symbol="${o.symbol}" type="button"`)}</form><small class="muted">Unrealized P&L includes entry fees but not estimated exit costs.</small></div>`;}).join('');}
function pendingHTML(p){return p.orders.map(o=>`<div class="card order-row"><div><strong>${o.symbol} · ${o.qty} units · Buy ${o.type}</strong><p>Entry ${money(o.price,4)} · ${money(o.reserve)} reserved<br>Stop ${o.stop===null?'none':money(o.stop)} · target ${o.target===null?'none':money(o.target)}</p></div>${btn('Cancel entry','cancel-order','compact',`data-id="${o.id}"`)}</div>`).join('')||'<div class="empty">No pending entry orders. A limit instruction is not the same thing as an owned position.</div>';}
function portfolioView(p,m){return `<div class="stats">${stat('Cash balance',money(m.cash),'Includes reserved cash')}${stat('Holdings at current marks',money(m.held),'Not guaranteed sale proceeds')}${stat('Initial virtual deposit',money(p.initial),'No external deposits')}</div><div class="grid two topgap"><div class="card"><div class="spread"><h2>Equity over this run</h2><span class="badge">BAR-CLOSE MARKS</span></div><div class="equity-shell"><canvas id="equity-chart" data-chart="equity" role="img" aria-label="Synthetic account equity over time"></canvas></div><p class="muted">Cash + marked holdings. This line excludes intrabar drawdowns and any future exit cost.</p></div><div class="card"><h2>Reconcile the account</h2><div class="stats">${stat('Realized P&L',`<span class="${pnl(m.realized)}">${signed(m.realized)}</span>`)}${stat('Unrealized P&L',`<span class="${pnl(m.unrealized)}">${signed(m.unrealized)}</span>`)}</div><p>${money(p.initial)} initial + ${signed(m.realized)} realized + ${signed(m.unrealized)} unrealized = <strong>${money(m.equity)} equity</strong>.</p><p>Available cash: <strong>${money(m.cash-m.reserved)}</strong> after ${money(m.reserved)} of pending-entry reserves.</p><p>Fees charged to date: <strong>${money(m.fees)}</strong>. Spread and slippage are already embedded in fill prices.</p></div></div><div class="section-title topgap"><h2>Your holdings</h2>${btn('Return to desk','paper-tab','','data-tab="desk"')}</div>${positionsHTML(p,m)}${p.edits?`<div class="callout warn topgap">This run contains ${p.edits} history edit${p.edits===1?'':'s'}. It is useful for practice, not an untouched track record.</div>`:''}`;}
function historyView(p,m){return `<div class="spread bottomgap"><p class="muted">${p.events.length} fills · newest first · cash and holdings rebuild from these events</p>${V.undoPaper?btn('Undo last deletion','undo-delete'):''}</div><div class="callout ${p.edits?'warn':''} bottomgap">${p.edits?`Edited record: ${p.edits} edit(s). `:''}Removing a fill can make later sales or purchases impossible. The deletion preview identifies those dependencies. All active orders and protective exits will be canceled; surviving holdings need a new plan.</div>${p.events.length?`<div class="card inset"><div class="table-wrap"><table><thead><tr><th>Time</th><th>Instrument</th><th>Side</th><th>Units</th><th>Price</th><th>Fee</th><th>Realized</th><th>Action</th></tr></thead><tbody>${m.rows.slice().reverse().map(e=>`<tr><td>${E.clock(e.tick)}<small>${esc(e.reason)}</small></td><td>${e.symbol}${e.note?`<small>${esc(e.note)}</small>`:''}</td><td><span class="badge ${e.side==='buy'?'green':'purple'}">${e.side.toUpperCase()}</span></td><td>${num(e.qty)}</td><td>${money(e.price,4)}</td><td>${money(e.fee)}</td><td class="${pnl(e.realized||0)}">${e.realized===null?'—':signed(e.realized)}</td><td>${btn('Delete','delete-fill','compact ghost',`data-id="${e.id}" aria-label="Delete ${e.side} of ${e.qty} ${e.symbol}"`)}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty">No fills yet. Pending instructions appear on the desk, not in the fill history.</div>'}<p class="ledger-note">A sale’s realized result uses its proportional share of average purchase cost, including entry fees. Partial sales are not counted as separate winning “strategies.”</p>`;}
function journalView(){const j=V.journalEdit?S.journal.find(x=>x.id===V.journalEdit):null;return header('Trading journal','Record what you knew before the outcome. Review the decision, not just the profit.')+`<div class="grid two"><div class="card"><span class="eyebrow">${j?'EDIT YOUR REFLECTION':'NEW JOURNAL ENTRY'}</span><h2>Make the reasoning visible.</h2><form data-form="journal">${field('Title','title',j?.title||'','text','maxlength="200" required placeholder="Setup / instrument / session"')}<label class="field"><span>Before: context, trigger, stop, target, size, and reason to skip</span><textarea name="plan" rows="5" maxlength="12000" required placeholder="Before seeing the outcome, I believed…">${esc(j?.plan||'')}</textarea></label><label class="field"><span>After: what happened and what will I improve?</span><textarea name="review" rows="4" maxlength="12000" placeholder="Did I follow the plan? What did the result not prove?">${esc(j?.review||'')}</textarea></label><label class="field"><span>Process label</span><select name="status">${['Planned','Rules followed','Rule violation','Skipped'].map(s=>`<option ${j?.status===s?'selected':''}>${s}</option>`).join('')}</select></label><div class="actions"><button class="btn primary" type="submit">${j?'Save changes':'Save reflection'}</button>${j?btn('Cancel edit','journal-cancel','','type="button"'):''}</div></form></div><div class="card soft"><span class="eyebrow">QUESTIONS WORTH ASKING</span><h2>“Did I make money?” is only one question.</h2><p><strong>Before:</strong> Can I describe the setup without looking at future candles? Where is the idea invalid? What is the maximum planned loss, including costs?</p><p><strong>During:</strong> Did I chase, increase size impulsively, or move the stop to avoid accepting a loss?</p><p><strong>After:</strong> Did I follow a repeatable rule? What would I do the same way even if the outcome had been different?</p><p class="muted">Write honestly. You can edit or delete practice entries, but keep an untouched backup when reviewing a test sample.</p></div></div><div class="section-title topgap"><h2>Your reflections</h2><span class="muted">${S.journal.length} entries</span></div>${S.journal.map(j=>`<article class="card journal-entry"><div class="spread"><div><span class="badge">${esc(j.status)}</span><h3>${esc(j.title)}</h3><span class="entry-meta">${date(j.created)}${j.updated?' · edited':''}</span></div><div class="actions">${btn('Edit','journal-edit','compact',`data-id="${j.id}"`)}${btn('Delete','journal-delete','ghost compact',`data-id="${j.id}"`)}</div></div><div class="entry-label">BEFORE</div><p class="entry-body">${esc(j.plan)}</p>${j.review?`<div class="entry-label">AFTER</div><p class="entry-body">${esc(j.review)}</p>`:''}</article>`).join('')||'<div class="empty topgap">Your first written plan is more useful than another screenshot.</div>'}`;}

le>`).join('')}<p class="muted">Broker rules, margin requirements and settlement details can change. U.S. intraday-margin rules have changed in 2026, so this course does not treat the old $25,000 rule as a universal, current account requirement. Read the linked FINRA guidance and your broker’s current implementation before acting.</p>`;}
function settingsView(){const p=S.paper;return header('Settings & backup','Your work stays in this browser. You control the practice account and its data.')+`<div class="settings-grid"><section class="card"><span class="eyebrow">PHONE & OFFLINE USE</span><h2>Use a full browser.</h2><p>The single HTML file contains the lessons, charts, quizzes and simulator. It requires JavaScript but no account, wallet connection, or internet for core features.</p><p>Some phone file previews—including some in-app viewers—do not execute interactive HTML. When a file opens as a preview instead of a working app, use a full browser or the static website package on an HTTPS web host. A hosted copy can be added to your home screen where supported.</p><p><strong>Storage is local to this browser and file/site location.</strong> Moving the file, switching browser, private browsing, or clearing site data may lose or separate progress. Nothing syncs to another device.</p><div class="callout">${storageOK?'Local saving is working in this browser right now.':'Local saving is not available. Export before closing.'} Keep regular backups.</div></section>
 <section class="card"><span class="eyebrow">YOUR DATA</span><h2>Save a portable copy.</h2><p>A JSON backup includes lesson answers, quiz scores, completion, journal, replay reviews, and the complete paper account. It excludes any replay currently in progress.</p><div class="actions">${btn(`${ico('download')} Export backup`,'backup','primary')}${btn('Import backup','import')}</div><p class="muted">Import replaces this browser’s current data after confirmation. Export it first. Only load backups you trust.</p><div class="rule"></div><h3>Appearance</h3>${btn(S.settings.theme==='dark'?'Switch to light theme':'Switch to dark theme','theme')}<div class="rule"></div><p>Download a spreadsheet-readable record of the practice fills:</p>${btn('Export fill history as CSV','csv')}</section>
 <section class="card"><span class="eyebrow">EXECUTION ASSUMPTIONS</span><h2>Make costs explicit.</h2><form data-form="costs">${field('Fee per fill (%)','feePct',p.settings.feePct,'number','min="0" max="5" step="0.01" required')}${field('Full spread (basis points)','spreadBps',p.settings.spreadBps,'number','min="0" max="1000" step="1" required')}${field('Adverse market slippage (basis points)','slipBps',p.settings.slipBps,'number','min="0" max="1000" step="1" required')}<button class="btn" type="submit">Save cost assumptions</button></form><p class="muted">Changes affect future fills, not past events. To keep reserves consistent, all positions and pending entries must be closed before changing these assumptions. The change is logged.</p></section>

function prepareCanvas(canvas){const r=canvas.getBoundingClientRect(),ratio=Math.min(3,window.devicePixelRatio||1);if(!r.width||!r.height)return null;canvas.width=Math.round(r.width*ratio);canvas.height=Math.round(r.height*ratio);const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);return {ctx,w:r.width,h:r.height};}
function chartData(kind){if(kind==='replay'){const v=V.lab,l=labs[v.id];return {bars:l.bars.slice(0,v.at+1).map((b,i)=>({...b,t:i})),levels:[{value:l.level,label:'Reference',type:'blue'},...(v.position?[{value:v.position.stop,label:'Stop',type:'red'},{value:v.position.target,label:'Target',type:'accent'}]:[])],events:v.events,lab:true};}const p=S.paper,br=p.brackets[p.symbol];return {bars:E.bars(p,p.symbol),levels:br?[...(br.stop!==null?[{value:br.stop,label:'Stop',type:'red'}]:[]),...(br.target!==null?[{value:br.target,label:'Target',type:'accent'}]:[])]:[],events:p.events.filter(e=>e.symbol===p.symbol),lab:false};}
function drawCandles(canvas,kind,index=null){const setup=prepareCanvas(canvas);if(!setup)return;const {ctx,w,h}=setup,c=palette(),data=chartData(kind),all=data.bars,visible=all.slice(-58),offset=all.length-visible.length;
 const left=10,right=w<430?55:65,top=22,bottom=25,volumeH=50,priceBottom=h-bottom-volumeH-14,pw=w-left-right,ph=priceBottom-top,step=pw/visible.length;

function mutatePaper(fn){const snapshot=E.clone(S.paper);try{fn();E.ledger(S.paper);V.undoPaper=null;save();}catch(err){S.paper=snapshot;throw err;}}

function editBracket(symbol){const q=E.quotes(S.paper,symbol),b=S.paper.brackets[symbol];modal(`Protective exits · ${symbol}`,`<p>Applies to all remaining units. A blank field removes that exit. New stop must be below the current mark and target above it. A later gap can still fill worse.</p><form id="bracket-form" onsubmit="return false">${field('Stop price ($)','stop',b?.stop??'','number','min="0.0001" step="0.0001"')}${field('Target limit ($)','target',b?.target??'','number','min="0.0001" step="0.0001"')}</form>`,'Save exits',()=>{const a=Object.fromEntries(new FormData($('#bracket-form'))),stop=a.stop===''?null:Number(a.stop),target=a.target===''?null:Number(a.target);if(stop!==null&&(!Number.isFinite(stop)||stop<=0||stop>=q.mid))throw Error('Stop must be a positive number below the current mark.');if(target!==null&&(!Number.isFinite(target)||target<=q.mid))throw Error('Target must be above the current mark.');mutatePaper(()=>{if(stop===null&&target===null)delete S.paper.brackets[symbol];else S.paper.brackets[symbol]={stop,target,entryId:b?.entryId||'manual',createdTick:S.paper.tick};E.notice(S.paper,`${symbol}: protective exits changed. Stop ${stop??'none'}; target ${target??'none'}.`);});closeModal();render(true);toast('Protective instructions updated. Changing exits should follow a written plan.');});}
