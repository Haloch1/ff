</style></head><body><a class="skip-link" href="#main-content">Skip to content</a><aside class="sidebar" id="sidebar"></aside><header class="appbar" id="appbar"></header><main class="shell-main" id="main-content" tabindex="-1"><div id="app" class="content"></div></main><nav class="mobile-nav" id="mobile-nav" aria-label="Primary navigation"></nav><div class="toast" id="toast" role="status" aria-live="polite"></div><div id="modal-root"></div><input type="file" id="import-file" accept="application/json,.json" hidden><noscript><div class="noscript"><h1>Chartcraft needs a full browser.</h1><p>This is an interactive HTML course. Open it in a browser with JavaScript enabled, not a file preview. No account, wallet connection or deposit is required.</p></div></noscript><script id="course-data" type="application/json">{"lessons": [{"id": 0, "module": 0, "title": "Trading is a skill, not a salary", "sub": "Build the right expectations before you learn a single pattern.", "goals": ["Separate trading from investing.", "Understand what paper results can and cannot tell you.", "Choose a learning goal that does not require a profit."], "sections": [{"title": "What day trading actually means", "body": "<p>Day trading means opening and closing a position during the same trading day. A <strong>position<\/strong> is what you currently own or owe in a market. Buy a share at 10:00 and sell it at 11:20: that is a day trade. Buy today and sell next week: that is a multi-day trade, often called a swing trade. Hold for a business’s growth over years: that is closer to long-term investing.<\/p><p>The difference is the time horizon and decision process, not whether one person is “serious.” Each involves uncertainty. This course focuses on <strong>long-only, unleveraged practice<\/strong>: buy a fictional asset using available virtual cash, then sell only what you own.<\/p>"}, {"title": "Your job is to make a decision with incomplete information", "body": "<p>A chart is a record of past trades. It is not tomorrow’s answer sheet. A setup is a group of conditions that makes a trade worth investigating. An <strong>edge<\/strong> is a repeatable positive expected result after costs, not simply a pattern you recognize.<\/p><p>You can make a careful decision and lose. You can make a reckless decision and win. Judge the decision using information available before the outcome. Otherwise you train yourself to repeat lucky mistakes.<\/p>"}, {"title": "What this course is—and is not", "body": "<p>All prices, tickers, fills and scenarios here are synthetic. Nothing connects to a bank, exchange, wallet or brokerage. The simulator teaches mechanics; it does not measure a real-market edge. Its simplified fills cannot reproduce queues, liquidity crises, emotions or every broker rule.<\/p><p>No lesson, quiz score or practice profit guarantees income. Keep your business, school and essential money separate from this experiment. The goal is competence and informed choice—including deciding not to trade.<\/p>"}], "example": "<p>Sam buys 20 shares at $30 and sells at $30.40 the same day. The gross gain is 20 × $0.40 = $8. If total trading costs are $3, the net gain is $5. Another day, a move from $30 to $29.60 produces an $8 gross loss, plus the costs. Showing only the winning screenshot hides half the story.<\/p>", "diy": "Write two learning goals you can control and one outcome you cannot control. Then classify: buy Monday/sell Friday; buy 10:00/sell 10:45; buy for a five-year ownership plan.", "answer": "<p>Controllable goals: write an exit rule before every practice trade; correctly read 10 candles. Uncontrollable outcome: making a fixed daily profit. Monday to Friday is a multi-day/swing trade; 10:00 to 10:45 is a day trade; a five-year ownership plan is long-term investing. Labels alone do not establish suitability or religious permissibility.<\/p>", "takeaways": ["A winning trade does not prove skill.", "Net results include costs.", "Paper trading is education, not a salary forecast."], "quiz": [{"q": "Which is a day trade?", "options": ["Buy today and sell next month", "Buy and sell the same security during today’s session", "Buy only companies you like"], "correct": 1, "hint": "Think about the holding period.", "explain": "The entry and exit are within the same trading day."}, {"q": "You ignored your rules but made money. What did you prove?", "options": ["The rules are unnecessary", "You have a repeatable edge", "Only that this particular outcome was profitable"], "correct": 2, "hint": "One outcome is a tiny sample.", "explain": "A lucky outcome cannot validate an unreliable process."}, {"q": "What is the strongest first goal?", "options": ["Earn $100 every day", "Never take a loss", "Explain an entry, invalidation and risk before placing a paper trade"], "correct": 2, "hint": "Choose something your behavior can control.", "explain": "You control planning and execution, not the next price move."}], "refs": ["S01", "S12"], "lab": null}, {"id": 1, "module": 0, "title": "Read a candle like a tiny story", "sub": "Open, high, low and close—without guessing what happened inside.", "goals": ["Find the body and both wicks.", "Calculate a candle’s range.", "Avoid treating candle color as a forecast."], "sections": [{"title": "The four numbers", "body": "<p>One candlestick summarizes a time interval. <strong>Open<\/strong> is the first recorded trade in that interval. <strong>High<\/strong> is the highest recorded price. <strong>Low<\/strong> is the lowest. <strong>Close<\/strong> is the last recorded trade. These four numbers are abbreviated OHLC.<\/p><p>The thick body connects open and close. The thin lines, or wicks, extend to the high and low. In this app, an up candle is green and hollow; a down candle is coral and filled. The shape also distinguishes them so color is not your only clue.<\/p>"}, {"title": "Read the measurements, not just the color", "body": "<p>Suppose O = $20, H = $21.20, L = $19.70 and C = $20.80. The body is $0.80 tall. The full range is $1.50. The upper wick is $0.40, and the lower wick is $0.30. The close finished above the open, but the next candle could still go down.<\/p><p>A long upper wick tells you price traded higher and did not finish there. It does not tell you which trader acted or why. A tiny body means open and close were close together; it does not mean nothing happened.<\/p>"}, {"title": "The candle hides the path", "body": "<p>The same OHLC values can describe “up first, then down” or “down first, then up.” This matters when a target and stop both lie inside one candle. You cannot know which was touched first from that candle alone.<\/p><p>Our simulator uses a disclosed conservative rule: when both protective levels are reachable inside one bar and the open does not settle the order, the stop is assumed to trigger first. Real tick data might tell a different story.<\/p>"}], "example": "<p>A candle opens at $50, drops to $48, rises to $52 and closes at $49. It is a <strong>down candle<\/strong> even though it traded above $50 during the interval. Body = $1; upper wick = $2; lower wick = $1; range = $4.<\/p>", "diy": "A five-minute candle has O = 10.00, H = 10.70, L = 9.80 and C = 10.50. Identify direction, body, range and both wicks. Can you prove whether $10.70 happened before $9.80?", "answer": "<p>Up candle; body $0.50; range $0.90; upper wick $0.20; lower wick $0.20. You cannot establish the high/low sequence from OHLC alone. Use the candle builder below to change each number and check the shape.<\/p>", "takeaways": ["Body connects open to close; wicks reach high and low.", "Range equals high minus low.", "One candle does not reveal order flow or the future."], "quiz": [{"q": "O=40, H=43, L=39, C=41. What is the range?", "options": ["$1", "$3", "$4"], "correct": 2, "hint": "Use high minus low, not close minus open.", "explain": "43 − 39 = $4."}, {"q": "A green candle guarantees…", "options": ["A higher next candle", "Only that its close is above its open in this display", "More individual buyers than sellers"], "correct": 1, "hint": "Separate a past measurement from a prediction.", "explain": "Green describes the open/close relationship, not the future or participant count."}, {"q": "Both stop and target lie inside one bar. What is unknown?", "options": ["The bar’s range", "Its closing price", "Which level traded first"], "correct": 2, "hint": "Four numbers are not a tick-by-tick recording.", "explain": "OHLC alone does not give the sequence of intrabar trades."}], "refs": ["S03", "S06"], "lab": null}, {"id": 2, "module": 0, "title": "Timeframes, zoom and the bigger picture", "sub": "A five-minute bounce can live inside an hourly downtrend.", "goals": ["Explain what a timeframe changes.", "Combine context and entry charts.", "Keep your rules on a fixed timeframe."], "sections": [{"title": "A timeframe is the size of the bucket", "body": "<p>On a one-minute chart, each completed candle collects one minute of trades. On a five-minute chart, it collects five. Five one-minute bars aggregate into one five-minute bar: take the first open, highest high, lowest low, last close, and sum of volume.<\/p><p>Zooming only changes how much history you see. Changing timeframe changes the information grouped into each bar. Do not confuse a steep-looking line on a zoomed-in screen with a large percentage move.<\/p>"}, {"title": "Context first, detail second", "body": "<p>Think of navigation: an overview map shows the city; a street map shows the turn. For a training exercise, use a 15-minute chart to mark direction and major zones, then a five-minute chart for a precise trigger. Those are teaching choices, not proven optimal settings.<\/p><p>If the larger chart has falling highs and lows, a two-candle bounce on the small chart has not automatically reversed it. A long entry may be a countertrend idea with different risks, not the same setup as buying a pullback in an established uptrend.<\/p>"}, {"title": "Completed candles and moving goalposts", "body": "<p>An unfinished candle can change shape until it closes. A breakout above resistance at 10:03 may finish below resistance when the five-minute candle closes. A rule requiring a close must wait for a completed candle.<\/p><p>Do not enter using a five-minute invalidation, then switch to the hourly chart only because the trade is losing. That changes the agreement after money is committed. Pick context, trigger and invalidation timeframes before the trade.<\/p>"}], "example": "<p>Five closes are $10.10, $10.30, $10.20, $10.60 and $10.40. These are five separate one-minute endpoints—not five separate five-minute signals. The combined five-minute close is $10.40. You also need each bar’s highs and lows to reconstruct the combined range.<\/p>", "diy": "You see a strong one-minute bounce, but the 15-minute chart is still making lower highs. Write a cautious description without calling it a confirmed trend reversal. What would a rule requiring a five-minute close make you wait for?", "answer": "<p>“A short-term bounce is occurring inside a larger downtrend; a reversal is not established.” Wait until the five-minute interval has finished and check its final close against the level. That still does not guarantee continuation.<\/p>", "takeaways": ["Timeframe changes the bucket; zoom changes the view.", "An unfinished candle is not a confirmed close.", "Do not change your invalidation timeframe to rescue a loser."], "quiz": [{"q": "Five one-minute bars form a five-minute bar. Its close is…", "options": ["The average of all closes", "The final one-minute close", "The highest one-minute close"], "correct": 1, "hint": "Close means the last observation.", "explain": "The aggregate closes where the final constituent candle closes."}, {"q": "A one-minute bounce inside an hourly downtrend is…", "options": ["Definitely an hourly reversal", "Possibly just a smaller bounce", "A guaranteed short sale"], "correct": 1, "hint": "Different scales can disagree.", "explain": "A short-term move need not change larger market structure."}, {"q": "A candle-close rule can be evaluated reliably…", "options": ["Before the candle closes", "When the relevant candle has completed", "Only on a daily chart"], "correct": 1, "hint": "The final shape is not known while it is forming.", "explain": "Waiting for completion prevents using a temporary intrabar breakout as a confirmed close."}], "refs": ["S03", "S04"], "lab": null}, {"id": 3, "module": 0, "title": "The auction: bid, ask, spread and liquidity", "sub": "Understand why the chart price is not always your fill price.", "goals": ["Distinguish liquidity from volume and market cap.", "Calculate the cost of crossing a spread.", "Understand why buying activity is not enough."], "sections": [{"title": "Two prices, not one", "body": "<p>The <strong>bid<\/strong> is a price a buyer currently offers. The <strong>ask<\/strong> is a price a seller currently requests. The best ask minus the best bid is the <strong>spread<\/strong>. A market buyer generally trades against sellers at the ask; a market seller generally trades against buyers at the bid.<\/p><p>The last price on a chart is a historical transaction. It is not a promise that enough shares are available at that price now. Quotes can move, vanish or have only a small quantity behind them.<\/p>"}, {"title": "Liquidity is about execution", "body": "<p>A liquid market can typically absorb trades with less price impact. <strong>Depth<\/strong> is the quantity offered at different prices. <strong>Volume<\/strong> is how much actually traded during a period. A high volume bar does not guarantee deep liquidity when you try to exit.<\/p><p><strong>Market capitalization<\/strong> is price multiplied by a supply/share-count measure. A fictional token at $0.02 with 100 million circulating tokens has a $2 million circulating market cap. That is not $2 million sitting in an exit pool. Fully diluted value uses a different supply assumption.<\/p>"}, {"title": "Every completed trade has two sides", "body": "<p>“People are buying” is incomplete: every matched trade has a buyer and seller. More aggressive buyers may accept higher offers, but a screen showing many small buys could still hide one large seller. Reported volume can also be misleading in manipulated markets.<\/p><p>On an automated-market-maker venue, swaps move along a pool’s pricing rule rather than a conventional order book. A small pool can produce severe price impact. This app uses a simplified quote model; it does not reproduce decentralized-exchange mechanics.<\/p>"}], "example": "<p>Bid $24.90, ask $25.10. You buy 100 at the ask and instantly sell 100 at the unchanged bid. You lose 100 × $0.20 = <strong>$20<\/strong>, before separate fees. The market did not need to move against you for the round trip to cost money.<\/p>", "diy": "Compare A: bid $49.99 / ask $50.01 with meaningful depth, and B: bid $49 / ask $51 with very little depth. What is each quoted spread? Which is harder to model with a tight $0.20 stop?", "answer": "<p>A’s spread is $0.02. B’s is $2. A $0.20 planned stop is tiny compared with B’s spread, and shallow depth adds execution uncertainty. A still has risk; the comparison only addresses friction and liquidity.<\/p>", "takeaways": ["Market cap is not available exit liquidity.", "Spreads and price impact reduce returns.", "Participant counts alone do not reveal reliable demand."], "quiz": [{"q": "Bid=9.90 and ask=10.10. The spread is…", "options": ["$0.10", "$0.20", "$10"], "correct": 1, "hint": "Subtract the best bid from the best ask.", "explain": "10.10 − 9.90 = $0.20."}, {"q": "A $5 million token market cap means…", "options": ["$5 million can definitely be cashed out", "Price times the relevant supply equals $5 million", "The token cannot be manipulated"], "correct": 1, "hint": "It is a multiplication, not a bank balance.", "explain": "Market capitalization does not measure available liquidity."}, {"q": "A hundred tiny buys and one large sell prove…", "options": ["Price must rise", "Buyers outnumber sellers in economic size", "Very little without sizes, prices and context"], "correct": 2, "hint": "Count is not quantity.", "explain": "Transaction counts can obscure the amount traded and the available liquidity."}], "refs": ["S02", "S01"], "lab": null}, {"id": 4, "module": 0, "title": "Know what you are actually trading", "sub": "A similar-looking chart can represent a completely different contract.", "goals": ["Distinguish shares, ETFs, spot tokens and derivatives.", "Understand long positions and leverage.", "Separate chart skill from religious approval."], "sections": [{"title": "The instrument comes before the pattern", "body": "<p>A stock share is an ownership interest in a company. An ETF share represents an interest in a fund; the fund’s holdings, strategy and structure matter. A spot token may represent a network asset, utility, claim or something with much weaker rights. Read what you legally and economically receive.<\/p><p>An option, future, perpetual or contract for difference is a derivative contract—not simply the same asset with a different button. A chart pattern does not make those contracts equivalent.<\/p>"}, {"title": "Long, short and leveraged", "body": "<p>A <strong>long<\/strong> position generally benefits when the asset’s price rises. A short position generally benefits when it falls and can involve borrowing assets or using a derivative. <strong>Leverage<\/strong> makes exposure larger than your own capital; it can magnify losses as well as gains.<\/p><p>For a simple long-only cash trade, position value is units × price. If you have $1,000 and buy $800 of an asset, you retain about $200 before costs. Controlling $5,000 with $1,000 is a different risk arrangement. This course’s simulator does not permit borrowing or shorting.<\/p>"}, {"title": "A note on your Islamic-finance concern", "body": "<p>“Not a memecoin” does not automatically mean halal, and “short holding period” does not by itself settle the ruling. The asset, actual ownership, contract, business activities, interest arrangements and conduct need separate review. Good risk management does not issue a religious verdict.<\/p><p>Some questions about crypto classification remain disputed; the cited 2019 IIFA resolution requested further research. This course is not a fatwa or a Shariah certification. Keep the mechanics here separate from a qualified scholar’s assessment of the exact instrument and account.<\/p>"}], "example": "<p>Three screens all show a price near $50: a share, a token and a leveraged derivative. A $1 rise appears similar on the chart, but ownership rights, funding charges, liquidation risk, eligibility and religious questions can differ. The ticker and product specification matter more than the visual similarity.<\/p>", "diy": "Write a six-question instrument checklist: what do I own; how is it held; can I withdraw/transfer it; is there borrowing or interest; what does the underlying activity involve; what costs or contract obligations apply?", "answer": "<p>Your checklist should investigate rights and custody, not only price. Add “Who can independently explain the contract?” For faith-sensitive decisions, bring the exact product and account agreement to a qualified scholar. A platform’s marketing label is not enough.<\/p>", "takeaways": ["Choose the instrument before choosing the pattern.", "Leverage is not a shortcut to a reliable income.", "Stocks and ETFs also require their own Shariah review."], "quiz": [{"q": "An ETF is automatically Shariah-compliant because it is not crypto.", "options": ["True", "False", "Only when its chart goes up"], "correct": 1, "hint": "Consider holdings and structure.", "explain": "An ETF’s assets and arrangements need assessment; the label alone does not decide."}, {"q": "Leverage changes…", "options": ["Only profits", "Exposure relative to your own capital", "Nothing if you use a stop"], "correct": 1, "hint": "Losses scale too.", "explain": "Borrowing or leveraged contracts magnify exposure; stops do not remove all risks."}, {"q": "This simulator lets you…", "options": ["Borrow unlimited virtual capital", "Short an unowned asset", "Buy with available virtual cash and sell owned units"], "correct": 2, "hint": "The scope is intentionally long-only.", "explain": "The course isolates basic spot-style mechanics without borrowing or derivatives."}], "refs": ["S01", "S15"], "lab": null}, {"id": 5, "module": 1, "title": "Orders: instructions, not guarantees", "sub": "Choose which uncertainty you are willing to accept.", "goals": ["Compare market, limit, stop and stop-limit.", "Explain slippage and gaps.", "Understand a bracket order’s two exits."], "sections": [{"title": "Market and limit orders", "body": "<p>A <strong>market order<\/strong> asks to trade promptly at available prices. It emphasizes execution over price control. Trading halts, outages or absent liquidity can still prevent immediate execution. A <strong>limit order<\/strong> specifies the worst acceptable price: a buy limit caps your price; a sell limit sets a minimum. It can remain unfilled.<\/p><p>A chart touching a limit does not guarantee that your real order fills. Other orders may be ahead of you, and the displayed price may have traded for too little size. Our practice model fills a touched eligible limit in full, so it is more generous than a real queue.<\/p>"}, {"title": "A stop is a trigger", "body": "<p>A sell <strong>stop-market<\/strong> below a long position activates a market sell when the relevant trigger condition is met. The trigger is not a guaranteed fill price. A <strong>stop-limit<\/strong> instead activates a limit order. It controls the minimum sale price but can leave you holding a falling asset if price jumps below your limit.<\/p><p>A <strong>gap<\/strong> means the next available price is separated from the prior price. <strong>Slippage<\/strong> is the difference between the price you expected and the actual execution price. Broker trigger rules can use different reference prices; check them.<\/p>"}, {"title": "Bracket orders and time in force", "body": "<p>A bracket pairs a protective stop with a profit-taking limit. In an OCO arrangement, one exit cancels the other. Order support and cancellation behavior depend on the platform; never assume two independent sell orders automatically coordinate.<\/p><p>“Day” orders typically expire at the session boundary defined by the venue. “Good till canceled” orders remain subject to broker rules. In this app, all pending paper orders expire at the synthetic session end, and open positions are automatically flattened for the day-trading exercise.<\/p>"}], "example": "<p>You own 10 shares from $50 and set a sell stop at $49.50. A surprise causes the next available quote to be $48.80. A market exit near $48.80 loses about $12 before costs—not the planned $5. A stop-limit with a $49.40 minimum might not exit at all.<\/p>", "diy": "You will pay at most $30 but do not need to buy immediately. Which order matches that constraint? You already own an asset and prioritize exiting a collapse over a guaranteed price. Which order is closer to that goal, and what risk remains?", "answer": "<p>A buy limit at $30 matches the purchase cap, but may not fill. A stop-market is closer to prioritizing an exit after a trigger, but it can slip or fail to execute promptly during a halt/outage. No order eliminates all risk.<\/p>", "takeaways": ["A limit constrains price, not the chance of a fill.", "A stop trigger is not a guaranteed loss ceiling.", "Know how linked exits and cancellations work."], "quiz": [{"q": "A buy limit at $20 can normally fill…", "options": ["At $20 or lower", "Only above $20", "At any price"], "correct": 0, "hint": "A buy limit sets a maximum.", "explain": "A fill must be at the limit price or better, subject to execution availability."}, {"q": "Why can a stop-market lose more than planned?", "options": ["Stops are always fake", "The trigger price and executable price can differ", "Fees never apply to stops"], "correct": 1, "hint": "Think of a gap through the stop.", "explain": "Slippage, gaps and execution problems can produce worse prices."}, {"q": "The main risk of a protective stop-limit is…", "options": ["It must fill instantly", "It can stay unfilled while price falls", "It guarantees a profit"], "correct": 1, "hint": "Price protection can trade off against execution.", "explain": "A limit can prevent execution below your minimum even while losses grow."}], "refs": ["S02", "S01"], "lab": null}, {"id": 6, "module": 1, "title": "Position sizing: choose the loss before the size", "sub": "A $25 risk budget is not the same as buying $25 of stock.", "goals": ["Calculate planned risk per unit.", "Size a trade using both risk and available cash.", "Allow for costs without pretending risk is capped."], "sections": [{"title": "Start with the idea’s invalidation", "body": "<p><strong>Invalidation<\/strong> is the condition that would make your trade idea no longer fit its rules. For a long pullback, that might be a break below a specific swing low. Pick a meaningful level from the setup; do not choose a random tiny stop simply to afford a huge position.<\/p><p>For a basic long trade, planned price risk per unit = expected entry − expected stop fill. Then add a reasonable cost/slippage allowance. A risk budget is a planning amount, not a guarantee of the maximum loss.<\/p>"}, {"title": "The arithmetic", "body": "<p>Practice equity $10,000 × an illustrative 0.25% risk fraction = $25. Expected entry $50; expected stop $49.50; cost allowance $0.04 per unit. Planned loss per unit is $0.54. Floor($25 ÷ $0.54) gives <strong>46 units<\/strong>. “Floor” means round down to the nearest whole unit.<\/p><p>Buying 46 units ties up about $2,300, plus costs. Your planned risk is about $24.84, not the full position value. But a much larger fall or failed exit can produce a much larger loss.<\/p>"}, {"title": "Respect both limits", "body": "<p>Your quantity must fit the risk budget <em>and<\/em> available cash after costs. If you have only $1,000 cash, a $2,300 position does not fit this cash-only course, even when its planned stop risk looks small.<\/p><p>Numbers such as 0.25% or 0.5% here are examples, not suitable-risk prescriptions. Correlated positions also add up: three trades affected by the same event are not three independent protections. You can choose zero exposure.<\/p>"}], "example": "<p>Entry $20; stop $19.75; cost allowance $0.05 per share; practice risk budget $15. Quantity = floor(15 ÷ 0.30) = <strong>50 shares<\/strong>. Notional = $1,000. Moving the stop to $19.50 without reducing size changes the risk to roughly $27.50.<\/p>", "diy": "Practice equity $8,000; illustrative risk 0.25%; entry $40; stop $39.60; costs $0.10 per unit. Calculate risk budget, quantity and approximate notional. Then check the result against $1,200 available cash.", "answer": "<p>Risk budget $20; loss per unit $0.50; risk-based quantity 40; notional $1,600. That exceeds $1,200. At most 30 shares fit before entry fees; including those fees may reduce it further. The smaller cash-constrained quantity is required.<\/p>", "takeaways": ["Choose invalidation before quantity.", "Risk budget and position value are different numbers.", "Gaps and execution failures can exceed planned risk."], "quiz": [{"q": "Risk budget $30; entry $10; stop $9.50; cost allowance $0.10. Quantity?", "options": ["60", "50", "300"], "correct": 1, "hint": "Divide by $0.60 and round down.", "explain": "30 ÷ (0.50 + 0.10) = 50 units."}, {"q": "Can you ignore available cash when stop risk is small?", "options": ["Yes", "No", "Only with a good pattern"], "correct": 1, "hint": "This is a cash-only model.", "explain": "The full purchase plus fees must be funded."}, {"q": "Moving a long stop lower after entry generally…", "options": ["Reduces risk", "Increases the planned loss on the same quantity", "Guarantees recovery"], "correct": 1, "hint": "The distance to the exit gets wider.", "explain": "A lower stop increases the adverse distance for a long position."}], "refs": ["S11", "S01"], "lab": null}, {"id": 7, "module": 1, "title": "R, win rate and expectancy", "sub": "Why a high win rate can still lose money.", "goals": ["Calculate reward-to-risk and R-multiples.", "Combine win size, loss size and frequency.", "Understand drawdown and small-sample uncertainty."], "sections": [{"title": "R is a measuring stick", "body": "<p><strong>1R<\/strong> is the initial planned risk for a trade. If you plan to risk $20 and make $40 net, that is +2R. Lose $20 and it is −1R. Lose $30 because of a gap and it is −1.5R. The initial denominator stays fixed even if you later move the stop.<\/p><p><strong>Reward-to-risk<\/strong> compares a planned target gain with a planned loss. A target two times as far away gives roughly 2:1 before costs. It does not mean the target is likely to be hit.<\/p>"}, {"title": "Expectancy combines frequency and size", "body": "<p>A simplified expectancy formula is: win probability × average win − loss probability × average loss. Use either all net results or subtract costs separately, but do not count costs twice.<\/p><p>Imagine 40 wins averaging $30 net and 60 losses averaging $10 net across 100 trades. Average result = (40 × 30 − 60 × 10) ÷ 100 = $6 per trade. These are invented numbers, not evidence that any pattern delivers that result.<\/p>"}, {"title": "Drawdowns and unreliable samples", "body": "<p><strong>Drawdown<\/strong> measures a decline from a prior equity peak. From $10,000 to $9,000 is a 10% drawdown. Recovering requires $1,000 ÷ $9,000 ≈ 11.1%, not 10%. Losses shrink the base you must rebuild.<\/p><p>Five winners do not reliably estimate your true win rate. Even a positive 100-trade sample can be lucky, selected or specific to one market regime. Results must survive costs, fresh samples and different conditions; the course’s generated scenarios cannot establish that.<\/p>"}], "example": "<p>A trader wins 9 times at $5 each and loses once at $80. Total = $45 − $80 = <strong>−$35<\/strong> before any omitted costs. The win rate is 90%, but the strategy loses in this sample. Another trader can have a lower win rate and a better average outcome.<\/p>", "diy": "For a 20-trade sample, 8 wins average $40 net and 12 losses average $20 net. Calculate total P&L, average per trade and the sample expectancy in R when each initial risk was $20.", "answer": "<p>Total = $320 − $240 = $80. Average = $4 per trade. In R, 8 × 2R − 12 × 1R = 4R total; average = +0.2R. This small invented sample demonstrates arithmetic, not a proven edge.<\/p>", "takeaways": ["Win rate alone is incomplete.", "A target ratio is not a success probability.", "Keep the original risk denominator when measuring R."], "quiz": [{"q": "Risk $25 and make $50 net. Result?", "options": ["+0.5R", "+2R", "+25R"], "correct": 1, "hint": "Divide net P&L by initial risk.", "explain": "50 ÷ 25 = +2R."}, {"q": "Nine $5 wins and one $80 loss produce…", "options": ["+$35", "−$35", "+$80"], "correct": 1, "hint": "Add all outcomes, not just wins.", "explain": "45 − 80 = −35."}, {"q": "A 2:1 target-to-risk ratio tells you…", "options": ["The trade wins two-thirds of the time", "The planned payoff shape, not the win probability", "The trade is safe"], "correct": 1, "hint": "Distance is not probability.", "explain": "A farther target can be less likely; both likelihood and payoff matter."}], "refs": ["S11"], "lab": null}, {"id": 8, "module": 2, "title": "Market structure: the chart’s skeleton", "sub": "Higher highs, lower lows and the difference between a pullback and a reversal.", "goals": ["Identify swing points.", "Describe trends objectively.", "Avoid pretending swing points were obvious in real time."], "sections": [{"title": "Peaks and valleys", "body": "<p>A <strong>swing high<\/strong> is a local peak; a <strong>swing low<\/strong> is a local valley. An uptrend is commonly described by a sequence of higher highs and higher lows. A downtrend uses lower highs and lower lows. When neither sequence is clear, price may be ranging or transitioning.<\/p><p>Suppose price rallies 50 → 52, pulls back to 51, rallies to 53 and pulls back to 52. The peaks 52 then 53 are higher highs; the lows 51 then 52 are higher lows. That describes what has happened, not what must happen next.<\/p>"}, {"title": "Use a repeatable swing rule", "body": "<p>For practice, you might define a swing high as a candle whose high exceeds the highs of the two candles before and the two after it. That is objective—but you cannot confirm it until those two later candles exist.<\/p><p>When reviewing history, label the confirmation time as well as the peak time. Otherwise your backtest may act on information it did not yet have. Real-time structure is often messier than perfect textbook zigzags.<\/p>"}, {"title": "Break of structure is a description", "body": "<p>Traders use <strong>break of structure<\/strong> for a breach of a selected swing point. Different communities define it differently. Write whether you require a wick, a close or follow-through, and which timeframe and swing rule you use.<\/p><p>A break below one higher low can warn that an uptrend is weakening. It does not prove a permanent reversal or that a hidden institution caused it. Structure gives you a way to organize risk and describe change.<\/p>"}], "example": "<p>Confirmed highs: 30, 32, 33. Confirmed lows: 28, 29, 31. That is an upward sequence. Price then closes below 31. The prior pattern is challenged. A careful description is “the latest higher low failed,” not “the market will definitely crash.”<\/p>", "diy": "Highs are 80, 78, 76. Lows are 75, 73, 71. Name the structure. A bounce to 74 occurs next. What has and has not changed?", "answer": "<p>The sequence is a downtrend. A bounce to 74 alone does not exceed the latest high of 76 or establish a higher-low/higher-high sequence. It might remain a countertrend bounce. Wait for your defined confirmation rather than inventing a reversal.<\/p>", "takeaways": ["Structure organizes past price swings.", "Confirmed swing labels require later information.", "Define “break” before applying it."], "quiz": [{"q": "Higher highs plus higher lows usually describe…", "options": ["An uptrend", "A downtrend", "A guaranteed breakout"], "correct": 0, "hint": "Compare peaks and valleys.", "explain": "Both are moving upward."}, {"q": "A rule requiring two later bars to confirm a swing can be used…", "options": ["At the peak before those bars exist", "Only after the confirmation bars exist", "Without any timing rule"], "correct": 1, "hint": "Avoid future information.", "explain": "Using the label earlier creates look-ahead bias."}, {"q": "A structure break proves institutional intent.", "options": ["True", "False", "Only on a one-minute chart"], "correct": 1, "hint": "A chart does not identify who acted or why.", "explain": "A breach is observable; the actor’s identity and intent are not established by it."}], "refs": ["S04"], "lab": 0}, {"id": 9, "module": 2, "title": "Support and resistance are zones", "sub": "Build a map, not a collection of magic lines.", "goals": ["Mark reaction areas rather than exact pennies.", "Explain a possible role reversal.", "Use nearby obstacles when planning a target."], "sections": [{"title": "A floor that can break, a ceiling that can lift", "body": "<p><strong>Support<\/strong> is an area where falling price has previously met enough demand to stabilize or rise. <strong>Resistance<\/strong> is an area where rising price has previously met enough supply to stall or fall. They are observations about interactions, not physical barriers.<\/p><p>If lows occur at $49.85, $49.95 and $50.05, treating $49.85–$50.05 as a zone can be more honest than drawing a single “perfect” line at $50. The width should reflect the asset and timeframe, not a universal rule.<\/p>"}, {"title": "Role reversal is a hypothesis to test", "body": "<p>After price breaks above a resistance zone, that zone may later behave as support. Traders call a return to it a <strong>retest<\/strong>. The important word is “may.” A return can instead move straight through the zone and invalidate the breakout.<\/p><p>Repeated touches do not guarantee that a level grows stronger forever. Interest at the level can change or be absorbed. Look at the reaction, closes and context rather than counting touches as a certainty score.<\/p>"}, {"title": "Do not draw the answer afterward", "body": "<p>Mark levels using candles already available. A level that only looks meaningful after a huge move was not necessarily identifiable before the trade. Keep a small number of relevant areas: recent session extremes, clear swing zones and the next likely obstacle.<\/p><p>For a long trade, the nearest resistance matters. A setup with $0.80 of planned risk but only $0.20 of room before a major obstacle does not become attractive just because you draw an ambitious target beyond it.<\/p>"}], "example": "<p>Price rejects $20 three times, closes at $20.30, revisits $20.05 and holds. A trader may investigate a breakout-retest long. An example plan could enter only after a new upward trigger, invalidate below the retest low and assess resistance above. A close back below the zone would weaken that plan.<\/p>", "diy": "Lows cluster at 39.90, 40.00 and 40.12. Mark a zone. A planned entry is 40.30, stop 39.80 and first obstacle 40.55. What is the rough room-to-risk ratio before costs?", "answer": "<p>A reasonable observed zone is roughly 39.90–40.12. Risk is $0.50 and room is $0.25, so room-to-risk is about 0.5:1 before costs. This is a reason to reconsider, not a command to move the stop to an artificial level.<\/p>", "takeaways": ["Zones are hypotheses grounded in prior reactions.", "A former resistance can fail as support.", "Targets should respect nearby obstacles."], "quiz": [{"q": "Three lows at 10.01, 9.96 and 10.04 suggest…", "options": ["A possible support zone near $10", "A guaranteed floor at exactly $10", "That all future lows must match"], "correct": 0, "hint": "Prices cluster around areas.", "explain": "The observations support a zone hypothesis, not a guarantee."}, {"q": "Resistance becoming support is…", "options": ["Mandatory after every breakout", "A possible role reversal", "A trading fee"], "correct": 1, "hint": "The retest can fail.", "explain": "Changed behavior is possible but must be observed."}, {"q": "Risk $0.50 and nearby obstacle $0.25 away gives…", "options": ["2:1 room-to-risk", "0.5:1 room-to-risk", "No useful information"], "correct": 1, "hint": "Divide room by risk.", "explain": "0.25 ÷ 0.50 = 0.5 before costs."}], "refs": ["S05"], "lab": 0}, {"id": 10, "module": 2, "title": "Volume and VWAP: useful context", "sub": "See activity and average traded price without turning them into fortune-tellers.", "goals": ["Interpret volume without confusing it with profit.", "Calculate a simple volume-weighted average.", "Understand session anchors."], "sections": [{"title": "Volume tells you how much traded", "body": "<p>Volume counts units traded during an interval. A tall bar means more activity than a shorter bar on the same scale. It does not say whether the activity was smart, honest or likely to continue. A red price candle can still contain many aggressive buyers.<\/p><p><strong>Relative volume<\/strong> compares current activity with a stated baseline. Comparing the opening five minutes with midday can mislead because activity often varies through the session. Define the comparison window and data source.<\/p>"}, {"title": "VWAP gives busy prices more weight", "body": "<p><strong>Volume-weighted average price<\/strong> weights prices by traded volume. With exact trades, sum price × size and divide by total size. Charting tools often approximate this with each bar’s typical price, (high + low + close) ÷ 3, multiplied by its volume.<\/p><p>If 100 units trade at $10 and 300 at $12, VWAP is (100 × 10 + 300 × 12) ÷ 400 = $11.50. A plain average of the two prices is $11, which ignores that more trading occurred at $12.<\/p>"}, {"title": "A reference line, not a magnet", "body": "<p>Session VWAP resets at a selected session start. Other anchored VWAPs start at a chosen event or date. Two charts with different anchors or data feeds can show different values. For 24-hour markets, the chosen session boundary is a convention.<\/p><p>Price above VWAP means price is above that volume-weighted average. It does not require another rise. Price crossing VWAP repeatedly can signal choppy conditions, but any rule built on that observation still needs testing.<\/p>"}], "example": "<p>A fictional asset trends upward, pulls back near its rising session VWAP and forms a higher low. That combination may give context for a long setup. The entry still needs a defined trigger, invalidation, workable spread and room above. “Touched VWAP” alone is not a complete plan.<\/p>", "diy": "200 units trade at $5 and 100 units at $8. Compute VWAP. Then explain why a price of $7, which is above VWAP, is not proof that you should buy.", "answer": "<p>VWAP = (200 × 5 + 100 × 8) ÷ 300 = $6. Price at $7 is above that historical weighted average. The arithmetic contains no prediction about the next trade, the asset’s value or whether costs leave an edge.<\/p>", "takeaways": ["Volume measures activity, not intent.", "VWAP weights price by traded size.", "Always know the VWAP anchor and data source."], "quiz": [{"q": "100 units at $10 and 300 at $12 gives VWAP…", "options": ["$11", "$11.50", "$12"], "correct": 1, "hint": "Weight the second price three times as heavily.", "explain": "(1,000 + 3,600) ÷ 400 = 11.50."}, {"q": "High volume guarantees…", "options": ["A breakout succeeds", "A buyer’s profit", "Neither of those"], "correct": 2, "hint": "Activity can accompany failure.", "explain": "Volume is contextual information, not a promise."}, {"q": "Different VWAP anchors can produce…", "options": ["Different values on the same price chart", "Only identical values", "A risk-free entry"], "correct": 0, "hint": "The averages include different observations.", "explain": "The starting point changes the data being accumulated."}], "refs": ["S07", "S16"], "lab": 2}, {"id": 11, "module": 2, "title": "EMA, RSI and ATR without indicator overload", "sub": "Three tools that answer three different questions.", "goals": ["Distinguish trend smoothing, momentum and volatility.", "Understand lag and correlated indicators.", "Avoid automatic buy/sell interpretations."], "sections": [{"title": "EMA: a smoother with memory", "body": "<p>An exponential moving average gives greater weight to more recent prices. It smooths movement but necessarily reacts to data that already happened. One common calculation uses alpha = 2 ÷ (periods + 1), then new EMA = alpha × current close + (1 − alpha) × previous EMA.<\/p><p>If alpha is 0.2, the old EMA is $50 and the new close is $51, the new EMA is $50.20. A crossover can describe changing momentum, but a sideways market can produce repeated false signals.<\/p>"}, {"title": "RSI: relative recent strength", "body": "<p>The relative strength index compares smoothed recent gains and losses, usually expressed from 0 to 100. Common “overbought” and “oversold” thresholds are 70 and 30, but those labels do not mean “must reverse now.” A strong trend can stay extreme.<\/p><p><strong>Divergence<\/strong> means price and an indicator are not making matching extremes. It can warn of changing momentum, but it does not give an exact reversal time. Adding several momentum indicators can simply repeat the same information.<\/p>"}, {"title": "ATR: how wide the movement has been", "body": "<p>Average true range summarizes recent volatility. True range is the largest of high minus low, absolute high minus previous close, and absolute low minus previous close. It therefore accounts for gaps as well as intrabar movement.<\/p><p>An ATR of $1 does not say price will go up $1 or stay within $1. It is a historical scale reference. A tiny stop on an asset that routinely swings much more may be unrealistic; any ATR-based rule needs a specific timeframe and testing.<\/p>"}], "example": "<p>Yesterday’s close is $50. Today’s high is $54 and low is $52. The three distances are $2, $4 and $2. True range is <strong>$4<\/strong>, not $2, because the gap matters. This still says nothing about tomorrow’s direction.<\/p>", "diy": "EMA is rising, RSI is 78 and ATR has doubled. Describe each observation separately. Why would “RSI over 70, so sell immediately” be an unsupported rule without testing?", "answer": "<p>The chosen average is rising; recent upward changes dominate the RSI calculation; recent range/gap movement has expanded. None establishes a certain reversal. RSI can remain high, and the increased volatility may demand different sizing or no trade.<\/p>", "takeaways": ["EMA smooths; RSI measures relative momentum; ATR measures volatility.", "Indicators lag and can duplicate one another.", "Extreme readings do not force price to reverse."], "quiz": [{"q": "Which directly describes volatility rather than direction?", "options": ["ATR", "A bullish headline", "Your profit target"], "correct": 0, "hint": "Think range, not up or down.", "explain": "ATR summarizes recent true ranges."}, {"q": "RSI at 80 means…", "options": ["Price must fall next", "The oscillator is elevated; reversal is not guaranteed", "The asset is 80% safe"], "correct": 1, "hint": "A strong trend can stay extreme.", "explain": "RSI is a momentum measurement, not a reversal timer."}, {"q": "Previous close 20; high 23; low 22. True range?", "options": ["1", "2", "3"], "correct": 2, "hint": "Compare the gap from the previous close.", "explain": "max(23−22, |23−20|, |22−20|) = 3."}], "refs": ["S08", "S09", "S10"], "lab": null}, {"id": 12, "module": 3, "title": "Breakout and retest", "sub": "A level breaks. The important question is what happens around it next.", "goals": ["Separate a wick through a level from a close beyond it.", "Write an observable entry trigger.", "Plan for a failed breakout."], "sections": [{"title": "The pattern in plain English", "body": "<p>A breakout occurs when price moves beyond a defined area. In a long breakout-retest idea, price first clears resistance, returns toward it, and then shows evidence of holding above or around the former barrier.<\/p><p>Imagine a door that has been closed. Opening it once is different from walking through and staying on the other side. The analogy helps recognition; the market is not obligated to behave like a door.<\/p>"}, {"title": "A complete example rule", "body": "<p>For a training rule, first mark a resistance zone using only prior bars. Require a completed five-minute close above it. Then wait for a retest and a higher low. An entry trigger might be a move above the retest candle’s high. Place invalidation beyond the retest low and calculate size before the order.<\/p><p>Different traders use different definitions. This is a rule to practice and test, not a claim of profitability. A no-retest breakout might run without you. Missing it is allowed; chasing it creates a different setup.<\/p>"}, {"title": "What can go wrong", "body": "<p>Price can return inside the old range, gap through the stop or break upward directly into a larger resistance zone. A retest can look clean and still fail. Higher volume may add context but does not guarantee continuation.<\/p><p>Ask four questions: did the required close occur; did the retest satisfy the rule; is the invalidation clear; is there reasonable room before the next obstacle? If your rule fails, do not rename the trade to keep holding.<\/p>"}], "example": "<p>Resistance $50.00–$50.10. Price closes at $50.40, retests to $50.12 and a later trigger appears near $50.35. A hypothetical entry $50.35, stop $50.05 and target $50.95 has $0.30 price risk and $0.60 gross reward per unit. Add costs; do not assume a perfect stop fill or that the target is reachable.<\/p>", "diy": "Price wicks above $20 but closes at $19.85. Your written rule requires a close above $20 followed by a retest. Is there an entry yet? Then try a replay below before seeing the future.", "answer": "<p>No. The first condition has not occurred. “Almost” is not the same as your rule. In replay, write the observed evidence and the invalidation before choosing buy, wait or skip. A later rise would not make an earlier rule violation correct.<\/p>", "takeaways": ["A breakout and a confirmed retest are separate events.", "Missing a move is not a loss.", "A valid-looking setup can still fail."], "quiz": [{"q": "A wick above resistance satisfies a rule requiring a close above it.", "options": ["Yes", "No", "Only with a green candle"], "correct": 1, "hint": "Use the exact condition.", "explain": "A wick is an intrabar excursion, not a completed close above the zone."}, {"q": "No retest occurs and price runs away. Your retest strategy should…", "options": ["Chase regardless of price", "Accept the missed trade", "Double size on the next trade"], "correct": 1, "hint": "An absent setup is not an obligation.", "explain": "Chasing changes entry, risk and the tested setup."}, {"q": "Entry 50.35, stop 50.05, target 50.95 gives gross reward-to-risk…", "options": ["1:1", "2:1", "3:1"], "correct": 1, "hint": "Reward is 0.60; risk is 0.30.", "explain": "0.60 ÷ 0.30 = 2 before costs."}], "refs": ["S05", "S06", "S11"], "lab": 0}, {"id": 13, "module": 3, "title": "Pullbacks, bull flags and bear flags", "sub": "A pause in a move is not automatically the end of the move.", "goals": ["Identify an impulse and a controlled pullback.", "Distinguish a flag from a deteriorating trend.", "Recognize bearish patterns without shorting."], "sections": [{"title": "Impulse, pause, possible continuation", "body": "<p>An <strong>impulse<\/strong> is a relatively strong directional move. A <strong>pullback<\/strong> is a move against it. A bull flag is a common label for an upward impulse followed by a smaller, often downward-sloping or sideways consolidation.<\/p><p>The idea is that price may be resting before another move up. The alternative is that the pause begins a reversal. The label does not decide between them.<\/p>"}, {"title": "Turn the picture into a rule", "body": "<p>Start with broader upward structure. Define the flag boundaries using visible bars. For practice, require a close above the pullback boundary and avoid entries stretched far from the planned invalidation. A stop might lie below the flag low, provided its distance makes sense for the setup.<\/p><p>“Controlled” needs a definition. You might record the number of bars, retracement relative to the impulse and overlap between bars. Do not quietly adjust those definitions on every losing example.<\/p>"}, {"title": "Do not buy every dip", "body": "<p>A pullback that destroys the preceding higher low or expands into heavy, fast selling may no longer fit the continuation rule. Falling price is not automatically a discount. A narrow-looking flag on a one-minute chart can also be a tiny bounce inside a larger decline.<\/p><p>A bear flag mirrors the geometry after a downward impulse. This course teaches you to recognize it as context for avoiding or exiting a long, not as an instruction to short or use a derivative.<\/p>"}], "example": "<p>Price climbs from $30 to $33, then drifts between $32.30 and $32.80. A trigger above $32.80 with invalidation below $32.30 is one testable idea. Buying at $34 after the move has already extended creates a much wider risk distance and may leave little room to the next obstacle.<\/p>", "diy": "Impulse: 10 → 12. Pullback A reaches 11.70 in small overlapping bars. Pullback B drops to 9.80 in one large candle. Which resembles the described continuation context, and why is neither a guaranteed buy?", "answer": "<p>A better resembles a shallow pause. B erases the impulse and challenges its structure. A still needs the exact trigger, costs, invalidation and room; its appearance alone cannot establish a positive expected result.<\/p>", "takeaways": ["A flag is a proposed continuation, not a certainty.", "A broken trend is not rescued by calling it a dip.", "Bearish recognition can help a long-only trader avoid entries."], "quiz": [{"q": "A bull flag normally starts with…", "options": ["An upward impulse", "A permanent price floor", "A guaranteed target"], "correct": 0, "hint": "The pause follows a directional move.", "explain": "A bull flag is generally described after upward movement."}, {"q": "Price falls below the key low your setup must hold. You should…", "options": ["Rename it a longer-term investment", "Reassess or follow the planned exit", "Buy more automatically"], "correct": 1, "hint": "The invalidation was chosen in advance.", "explain": "Changing the story to avoid a loss undermines the rule."}, {"q": "Recognizing a bear flag requires short selling.", "options": ["True", "False", "Only in stocks"], "correct": 1, "hint": "Observation and execution are different.", "explain": "You can use bearish context to stay out of long trades."}], "refs": ["S06", "S11"], "lab": 2}, {"id": 14, "module": 3, "title": "Triangles, pennants and wedges", "sub": "Compression is visible. Its eventual direction is not guaranteed.", "goals": ["Tell the main compression shapes apart.", "Avoid predicting a breakout from the name.", "Define a breakout and failed-breakout response."], "sections": [{"title": "Three useful triangle descriptions", "body": "<p>An <strong>ascending triangle<\/strong> has roughly flat resistance and rising lows. A <strong>descending triangle<\/strong> has roughly flat support and falling highs. A <strong>symmetrical triangle<\/strong> has falling highs and rising lows. In all three, the observed trading range narrows.<\/p><p>The names describe geometry. An ascending triangle can break down. A descending triangle can break up. Do not confuse the common directional interpretation with a certainty or a verified probability.<\/p>"}, {"title": "Pennants and wedges", "body": "<p>A pennant is a small converging consolidation after a sharp move. A flag is often more parallel-sided. A wedge has converging boundaries that both slope in the same direction, upward or downward. Real charts rarely match ideal diagrams exactly.<\/p><p>Draw boundaries from meaningful swing points already visible. If the lines only work by ignoring many inconvenient bars, the label may be less useful than simply describing choppy price.<\/p>"}, {"title": "Trade a specified event, not a drawing", "body": "<p>A training plan might require a completed close beyond a boundary, then a retest or defined follow-through. Invalidation can be linked to the breakout/retest structure. The target must respect actual nearby levels.<\/p><p>Some traders project the pattern’s height as a measured move. Treat that as a geometric planning reference, not an entitlement. Thin liquidity, news or a false breakout can overwhelm the pattern. Waiting or skipping is part of the exercise.<\/p>"}], "example": "<p>Highs cluster near $40; lows progress from $38 to $38.60 to $39.20. That resembles an ascending triangle. If price closes below the latest rising-low structure, the bullish hypothesis weakens. The word “ascending” does not protect the trade.<\/p>", "diy": "Highs are 15, 14.60, 14.20 and lows are 12, 12.50, 13.00. Name the geometry. Before seeing the next bar, write what would count as an upward break and what you would do if it immediately fails.", "answer": "<p>This resembles a symmetrical triangle. One possible rule requires a completed close above the current upper boundary and a successful retest. A failed retest or return through invalidation calls for the predetermined response. Choose a rule before reviewing the future.<\/p>", "takeaways": ["Compression is a condition, not a direction guarantee.", "Define boundary breaks consistently.", "Measured moves are not promised payouts."], "quiz": [{"q": "Flat highs and rising lows resemble…", "options": ["An ascending triangle", "A descending triangle", "A double top"], "correct": 0, "hint": "The lower boundary rises.", "explain": "That is the standard geometric description of an ascending triangle."}, {"q": "An ascending triangle cannot break down.", "options": ["True", "False", "Only on a daily chart"], "correct": 1, "hint": "Names are not guarantees.", "explain": "Patterns can fail or break in the less-expected direction."}, {"q": "A measured-move target is…", "options": ["A debt the market owes you", "A geometric reference to evaluate", "A stop-loss guarantee"], "correct": 1, "hint": "It is derived from the drawing.", "explain": "It can help planning but does not establish reachability or probability."}], "refs": ["S06"], "lab": 4}, {"id": 15, "module": 3, "title": "Ranges: edges, middle and breakout risk", "sub": "The most useful trade may be the one you do not take.", "goals": ["Identify a sideways range.", "Compare entries near edges with entries in the middle.", "Recognize when the range stops behaving like a range."], "sections": [{"title": "The sideways box", "body": "<p>A range is a period in which price oscillates between approximate upper and lower boundaries rather than maintaining a clean trend. A range-bounce long investigates buying near support and exiting before or near resistance, under a specific confirmation rule.<\/p><p>It is tempting to assume that because support held three times it must hold a fourth. But supply and demand change. The next visit can begin a sustained breakdown.<\/p>"}, {"title": "Location changes the math", "body": "<p>In a $48–$50 range, an entry near $48.20 with invalidation below support has different risk and room from an entry at $49.70. Buying close to the top may leave very little space before sellers previously appeared.<\/p><p>The middle often gives ambiguous risk placement: a meaningful stop may be far away, while the first obstacle is close. “It is moving” is not a reason to accept poor geometry.<\/p>"}, {"title": "Do not fight a regime change", "body": "<p>A <strong>regime<\/strong> is a broad market condition, such as trending, ranging or unusually volatile. A range strategy assumes repeated two-sided behavior. A decisive break followed by failure to reclaim the boundary challenges that assumption.<\/p><p>Range edges can overshoot before returning. That is why a precise rule must distinguish a tolerated excursion from invalidation. Widening a stop whenever the boundary fails turns a bounded idea into an uncontrolled hope.<\/p>"}], "example": "<p>Range $10–$12. Plan A: entry $10.20, stop $9.90, first target $11.70. Gross room/risk = $1.50 ÷ $0.30 = 5. Plan B: entry $11.70, same stop, target $12. Gross room/risk ≈ 0.17. Neither ratio proves an edge, but the locations are clearly different.<\/p>", "diy": "A $60–$62 range has held recently. Price is $61.80 and your structural stop would be $59.80. Calculate room to $62 and price risk. Explain why skipping can be a reasoned decision.", "answer": "<p>Room is $0.20 and risk is $2.00, or 0.1:1 before costs. Waiting for a different location or skipping avoids forcing an entry with poor nearby room. A later breakout does not make the earlier restraint irrational.<\/p>", "takeaways": ["The entry’s location affects room-to-risk.", "A range can become a trend.", "No trade is an active decision."], "quiz": [{"q": "Buying near the top of a range often leaves…", "options": ["Limited room before resistance", "Guaranteed breakout profit", "No need for a stop"], "correct": 0, "hint": "The next boundary is close.", "explain": "Nearby resistance can limit the available room for the initial thesis."}, {"q": "Support held three times. The next test…", "options": ["Must hold", "Can still break", "Cannot trade below it"], "correct": 1, "hint": "Past behavior is not a contract.", "explain": "The next interaction may differ."}, {"q": "Skipping a setup can be a valid result.", "options": ["Yes", "No", "Only after losing money"], "correct": 0, "hint": "You do not owe the market a trade.", "explain": "A clear reason to avoid a trade is part of disciplined selection."}], "refs": ["S05", "S11"], "lab": 6}, {"id": 16, "module": 3, "title": "Double bottoms, double tops and head-and-shoulders", "sub": "A shape is not complete just because you can almost see it.", "goals": ["Identify the neckline and confirmation point.", "Separate an early guess from a completed pattern.", "Use reversals as hypotheses."], "sections": [{"title": "A double bottom is more than two lows", "body": "<p>A double bottom usually describes two similar lows separated by a bounce. The intervening high creates a reference called the <strong>neckline<\/strong>. A common confirmation rule waits for a break above that level. Buying the second low before that event is a different, earlier and less-confirmed idea.<\/p><p>The lows do not have to match to the penny. Context matters: two small dips inside an otherwise falling trend may not represent a durable reversal.<\/p>"}, {"title": "Mirror images and shoulders", "body": "<p>A double top mirrors the structure: two similar highs, an intervening low and a possible break below it. Head-and-shoulders uses three peaks, with the middle peak higher; the neckline connects the intervening lows. The inverse version uses three troughs with the middle one lower.<\/p><p>These are common visual labels, not universal mechanical definitions. A sloping neckline makes the trigger different from a perfectly horizontal textbook example. Define how it is drawn using available data.<\/p>"}, {"title": "Confirmation improves specificity, not certainty", "body": "<p>Waiting for a neckline break may reduce some premature entries but can produce a worse entry price or miss a move. A retest may offer another observation, yet can also fail. There is a tradeoff rather than a universally perfect entry.<\/p><p>Bearish reversal recognition can tell a long-only trader to avoid initiating a long or to follow a planned exit. It does not require borrowing shares, shorting or buying a derivative.<\/p>"}], "example": "<p>Price falls to $25, bounces to $27, revisits $25.20 and rises. Until your required break above the $27 neckline, this is a <em>possible<\/em> double bottom. A later close at $27.20 satisfies that particular close rule, but a failure back below the relevant retest level can invalidate a subsequent entry.<\/p>", "diy": "Two lows appear at 18 and 18.10, separated by a bounce to 19.50. Current price is 18.60. Identify the neckline and explain what is still missing under a neckline-break rule.", "answer": "<p>The neckline reference is around 19.50. A completed break above that level is still missing. Buying at 18.60 would be an anticipatory strategy, not the confirmed-break rule; it needs separate testing and risk logic.<\/p>", "takeaways": ["Possible patterns are not completed patterns.", "The neckline provides a repeatable reference.", "Confirmation does not eliminate failure."], "quiz": [{"q": "In a double bottom, the neckline commonly comes from…", "options": ["The high between the two lows", "The lowest wick only", "The trader’s desired profit"], "correct": 0, "hint": "Look at the intervening bounce.", "explain": "That high is the reference for the common confirmation rule."}, {"q": "Two similar lows guarantee a reversal.", "options": ["True", "False", "Only if the asset is popular"], "correct": 1, "hint": "The existing downtrend may continue.", "explain": "Two lows alone do not determine the next move."}, {"q": "A head-and-shoulders pattern has…", "options": ["A middle peak higher than the outer peaks", "Three identical lows", "No neckline"], "correct": 0, "hint": "The “head” is the central high.", "explain": "The standard bearish geometry has two lower shoulders around a higher central peak."}], "refs": ["S06", "S05"], "lab": 8}, {"id": 17, "module": 3, "title": "Candle patterns in context", "sub": "Engulfing candles, pin bars, dojis and inside bars—without memorization traps.", "goals": ["Describe four common candle shapes.", "Connect the shape to its location.", "Require an entry rule beyond a catchy name."], "sections": [{"title": "Engulfing: compare bodies carefully", "body": "<p>A bullish engulfing description commonly means an upward candle’s real body covers the prior downward candle’s body. Some definitions require strict inequalities; others allow equal endpoints. State the definition you use. It does not necessarily mean the new candle engulfs both prior wicks.<\/p><p>At a meaningful support area after a pullback, this can be a clue that the latest interval closed strongly. In the middle of noisy price, it may be unremarkable. The preceding context changes the interpretation.<\/p>"}, {"title": "Pin bars, hammers and dojis", "body": "<p>A pin-bar-style candle has a relatively long wick and a smaller body near one end. A hammer-like candle near the end of a decline has a long lower wick. Similar geometry after a rise may receive a different label. The shape shows rejection within that interval, not the identity of the traders.<\/p><p>A <strong>doji<\/strong> has open and close very close together. It can indicate a balanced endpoint even when the intrabar range is huge. It is not automatically a reversal or a reason to enter.<\/p>"}, {"title": "Inside bars and confirmation", "body": "<p>An inside bar’s high is below the prior high and its low is above the prior low under a strict definition. It represents range contraction. A later break can go either way or fail.<\/p><p>For practice, use candle shapes as one ingredient: location, broader structure, trigger, invalidation and workable costs still matter. “Green candle appeared” is not a complete trading system. These names are a vocabulary for observation, not secret commands.<\/p>"}], "example": "<p>Prior body: open $10.40, close $10.00. Current body: open $9.95, close $10.50. The second body covers the first and closes upward: bullish engulfing under this definition. If major resistance is $10.55, an immediate long may still have poor room before the obstacle.<\/p>", "diy": "Prior range 30–32. Current O=31.10, H=31.80, L=30.20, C=31.12. What two descriptions fit? What cannot be concluded?", "answer": "<p>The current bar is inside the prior range, and its nearly equal open/close gives it a doji-like body. You cannot conclude the breakout direction or guarantee a profitable trade. A price-shape label needs context and a specific rule.<\/p>", "takeaways": ["Candle patterns describe relationships, not promises.", "Location can matter more than the pattern’s name.", "Know whether a definition compares bodies or full ranges."], "quiz": [{"q": "A doji means…", "options": ["Open and close are close together", "Price did not move during the bar", "The next bar must reverse"], "correct": 0, "hint": "The wicks can still be large.", "explain": "Open and close are similar even if the intrabar range was substantial."}, {"q": "An inside bar has…", "options": ["A range contained within the prior bar’s range", "A guaranteed upward breakout", "A larger range than every previous bar"], "correct": 0, "hint": "Compare high and low.", "explain": "Under the strict definition, its high is lower and its low is higher."}, {"q": "A bullish engulfing candle directly below resistance is…", "options": ["Automatically a buy", "A shape that still needs context and risk analysis", "Proof that resistance cannot hold"], "correct": 1, "hint": "Consider room above the entry.", "explain": "A recognizable candle can still be badly located."}], "refs": ["S03", "S06"], "lab": 10}, {"id": 18, "module": 3, "title": "Liquidity sweeps, reclaims and “smart money” labels", "sub": "Observe the move. Be careful about the story attached to it.", "goals": ["Define a sweep/reclaim in observable terms.", "Distinguish price evidence from claims about intent.", "Understand FVG and order-block terminology cautiously."], "sections": [{"title": "A sweep is a description, not a mind-reading tool", "body": "<p>In trading communities, a <strong>liquidity sweep<\/strong> often describes price briefly trading beyond a prior high or low and then returning. People may say stops were collected. The chart can show the excursion and return; it cannot by itself verify the location of every stop or who deliberately caused the move.<\/p><p>Because definitions vary, this course uses “sweep-and-reclaim” to mean a visible breach of a prior low followed by a completed close back above the reference level. That makes the exercise testable without a claim about hidden actors.<\/p>"}, {"title": "The reclaim is not the whole setup", "body": "<p>For a long exercise, first mark the low before the sweep. Observe the breach, then require your completed reclaim. A later upward trigger can be the entry condition, with invalidation below the sweep low or another defined structural point.<\/p><p>Costs matter: a deep sweep can leave the stop far away; a tight stop may sit inside routine noise. A second move down can defeat the reclaim. A setup cannot be made certain by calling it institutional.<\/p>"}, {"title": "FVG and order blocks: terms, not established guarantees", "body": "<p>A common three-candle <strong>fair value gap<\/strong> definition for an upward move has the third candle’s low above the first candle’s high. It is a non-overlap under that definition, not proof that price must revisit the zone or that “fair value” has been measured.<\/p><p><strong>Order block<\/strong> is a community label for a selected region, often a candle before a strong move. Definitions differ. A visible candle cannot reveal every institutional order. These terms are included so you can understand videos, not because they establish a verified edge.<\/p>"}], "example": "<p>Prior low $30. Price trades to $29.70, then the candle closes at $30.10. A reclaim of $30 occurred under our definition. Buying before that close would be a different strategy. A later drop through the predetermined invalidation would defeat the long thesis even if someone calls it “another sweep.”<\/p>", "diy": "Old low 50.00; new low 49.60; candle close 49.85. Has the course’s reclaim condition occurred? Rewrite “whales hunted everyone’s stops” as a statement that the chart actually supports.", "answer": "<p>No: the close is still below 50.00. An observable statement is “price traded below the prior low and closed below that reference.” The candle does not identify the actors, all stop locations or their intentions.<\/p>", "takeaways": ["Describe observable price before guessing a cause.", "Define sweep and reclaim precisely.", "FVGs do not have to fill, and labels do not prove an edge."], "quiz": [{"q": "Low breaks 20 but the candle closes at 19.90. Is 20 reclaimed by our close rule?", "options": ["Yes", "No", "Only if volume is high"], "correct": 1, "hint": "The close must return above the level.", "explain": "The reference was not reclaimed at the close."}, {"q": "A wick proves a bank intentionally hunted your stop.", "options": ["True", "False", "Only in crypto"], "correct": 1, "hint": "The chart lacks actor identity and intent.", "explain": "An excursion does not establish deliberate manipulation."}, {"q": "A fair value gap must be filled later.", "options": ["Always", "Never", "Neither claim is justified as a universal rule"], "correct": 2, "hint": "A visual non-overlap is not an obligation.", "explain": "Some zones are revisited and others are not; the name is not a guarantee."}], "refs": ["S04", "S11"], "lab": 10}, {"id": 19, "module": 3, "title": "Opening ranges, gaps and news", "sub": "The same setup can behave differently at a different time.", "goals": ["Define an opening range in advance.", "Explain why news changes execution risk.", "Keep session assumptions explicit."], "sections": [{"title": "Choose the window before the breakout", "body": "<p>An <strong>opening range<\/strong> is the high-to-low range during a chosen initial session window. For an example 15-minute opening range, collect the first three completed five-minute bars of the selected regular session. Only then are its high and low known.<\/p><p>An opening-range-breakout idea looks for movement beyond that range under a written rule. Changing the window from 15 to 5 minutes after seeing the winner introduces hindsight. The window is a strategy parameter, not a fact chosen by the chart.<\/p>"}, {"title": "Gaps and catalysts", "body": "<p>A <strong>catalyst<\/strong> is an event that may change expectations or attention, such as a company announcement. A gap between sessions can reflect new information. “Gap up” does not mean “will keep rising”; price can reverse or fluctuate violently.<\/p><p>A rumor is not a verified catalyst. Check original company or exchange information where possible. Scheduled events should be known before the trade; surprises remain possible. Stops cannot guarantee a price through a halt or gap.<\/p>"}, {"title": "Stocks and crypto do not share the same clock", "body": "<p>The simulator uses a fictional 78-bar session labeled 09:30–16:00 Eastern, with five-minute candles. The last bar starts at 15:55. Its automatic closing exits are an educational convention.<\/p><p>A 24-hour token market has no universal opening bell. A platform can choose a daily reset for its indicators, but that is not identical to a stock-exchange opening auction. Before real trading, verify the venue’s hours, order availability and current rules.<\/p>"}], "example": "<p>Opening-window high $75; low $73.50. After the window closes, price reaches $75.20 but the next candle closes back at $74.60. A wick-only entry and a close-and-retest entry would behave differently. Neither gets to use the later failure as information at the earlier entry time.<\/p>", "diy": "Three completed opening bars have highs 20.50, 20.80 and 20.60; lows 20.00, 19.90 and 20.10. Find the range. Can you have known the final range before the third bar closed?", "answer": "<p>Opening range = 19.90–20.80, width $0.90. The final extremes were not fully established before the window ended. A rule that uses the completed range must wait.<\/p>", "takeaways": ["The opening-range window is fixed before testing.", "News can overwhelm pattern geometry.", "A crypto day boundary is not a universal stock-market open."], "quiz": [{"q": "A 15-minute opening range using five-minute bars needs…", "options": ["Three completed bars", "One unfinished bar", "Fifteen daily bars"], "correct": 0, "hint": "15 divided by 5.", "explain": "Three full bars define the selected window."}, {"q": "A gap up guarantees…", "options": ["Continuation", "A safe fill", "Neither"], "correct": 2, "hint": "New information can produce reversals too.", "explain": "Direction at the open does not guarantee later direction or execution."}, {"q": "You change the opening window only on losing examples. This is…", "options": ["Consistent testing", "Hindsight-driven rule changing", "Better risk control"], "correct": 1, "hint": "The parameter was changed after seeing results.", "explain": "Selective redefinition biases the test."}], "refs": ["S01", "S11"], "lab": 12}, {"id": 20, "module": 4, "title": "False breakouts, chasing and no-trade decisions", "sub": "Learn to recognize the conditions that should make you pause.", "goals": ["Describe a failed breakout.", "Identify bad entry geometry and thin liquidity.", "Practice skipping without judging yourself by the next candle."], "sections": [{"title": "The breakout that does not stay out", "body": "<p>A <strong>false breakout<\/strong> moves beyond a chosen boundary and then fails to sustain the move according to your rule. The definition depends on timeframe and follow-through. A close back inside a prior range can be a warning, but a later recovery is also possible.<\/p><p>Do not label every losing breakout “manipulation.” Ordinary competing orders and changing information can produce the same visible result.<\/p>"}, {"title": "Chasing changes the trade", "body": "<p>Chasing means entering after a move has already carried price far from your intended entry or structural invalidation, often because you fear missing out. If the stop remains at its original structural location, risk per unit grows. If you move the stop artificially close, routine movement may stop you out.<\/p><p>Other reasons to skip include a spread large relative to the stop, contradictory context, unclear exits, a pending news event you cannot model, or insufficient available cash. Not every chart needs a trade.<\/p>"}, {"title": "Use a written veto list", "body": "<p>A <strong>veto<\/strong> is a condition that blocks a trade. For practice: no entry without a visible invalidation; no entry whose estimated friction consumes a large fraction of expected reward; no trade motivated by recovering an earlier loss; no copying a signal you cannot explain.<\/p><p>The exact thresholds need testing. A veto is valuable because it is chosen before the temptation. A skipped trade that later rises is not a realized loss and does not invalidate a reasonable process.<\/p>"}], "example": "<p>Your planned breakout entry was $25.20 with a $24.90 stop. Price has already reached $26.20, with resistance at $26.40. Chasing gives $1.30 risk for $0.20 room before that obstacle. The original setup’s math no longer applies.<\/p>", "diy": "Write a three-item veto list, then assess this trade: unclear support, a spread of $0.40, hoped-for target $0.30 away, and the only reason is “a verified account posted it.”", "answer": "<p>Reasonable vetoes include unclear invalidation, friction larger than nearby reward and unverified social-media reasoning. Verification is not independent investment due diligence. “Skip” is a complete answer here, even if the price later jumps.<\/p>", "takeaways": ["A later move does not retroactively justify a bad entry.", "Friction can consume the entire expected reward.", "Use no-trade conditions before emotions arrive."], "quiz": [{"q": "A skipped trade rises later. You have…", "options": ["Lost that profit from your account", "Missed an opportunity, not taken an account loss", "Proven your rules are useless"], "correct": 1, "hint": "Opportunity cost and realized loss differ.", "explain": "Not taking a position does not remove money from the account."}, {"q": "Expected move $0.20; spread alone $0.30. This is…", "options": ["A friction warning", "A guaranteed bargain", "Irrelevant"], "correct": 0, "hint": "The hurdle is larger than the proposed move.", "explain": "The expected gross room is smaller than a key transaction cost."}, {"q": "Every false breakout is deliberate manipulation.", "options": ["True", "False", "Only when you bought it"], "correct": 1, "hint": "Price behavior does not establish intent.", "explain": "Multiple mechanisms can produce a failed move."}], "refs": ["S01", "S14"], "lab": 14}, {"id": 21, "module": 4, "title": "Build a watchlist—not a copying habit", "sub": "Use other people as teachers, not as your buy button.", "goals": ["Separate instrument research from entry timing.", "Verify sources and incentives.", "Construct a small, understandable watchlist."], "sections": [{"title": "Start with why this market belongs on your screen", "body": "<p>A watchlist is a manageable set of instruments you may investigate. For practice, choose a small number with understandable behavior, usable data and an instrument structure you can explain. The paper desk offers three fictional instruments so you can learn without picking real investments.<\/p><p>For real assets, research the business or token rights, current information, venue, custody and liquidity before looking for an entry. A tidy chart cannot repair an unsuitable or fraudulent underlying asset.<\/p>"}, {"title": "What to watch and what not to copy", "body": "<p>Watching a teacher explain a chart can help you learn vocabulary. Pause before the outcome and write what you
